<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Square</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d0f12;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #c9d1d9;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #hud {
      position: fixed;
      top: 14px;
      left: 14px;
      font-size: 12px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.45);
      pointer-events: none;
    }

    #panel {
      position: fixed;
      top: 14px;
      right: 14px;
      width: 245px;
      background: rgba(18, 21, 27, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
      display: none;
    }

    #panel.open {
      display: block;
    }

    .row {
      margin-bottom: 10px;
    }

    .row:last-child {
      margin-bottom: 0;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      color: #9ba3af;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #ffffff;
      cursor: pointer;
    }

    .btn-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    button {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e5e7eb;
      padding: 5px 8px;
      border-radius: 5px;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.16);
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="hud">
    A / D or Left / Right: Move &nbsp;|&nbsp; W / Up / Space: Jump &nbsp;|&nbsp; Shift: Dash &nbsp;|&nbsp; Tab: Tuner &nbsp;|&nbsp; R: Reset
  </div>

  <div id="panel">
    <div class="row">
      <div class="label-row"><span>Gravity</span><span id="v-gravity">2400</span></div>
      <input type="range" id="s-gravity" min="400" max="6000" step="100" value="2400" />
    </div>
    <div class="row">
      <div class="label-row"><span>Jump Force</span><span id="v-jump">820</span></div>
      <input type="range" id="s-jump" min="200" max="1800" step="20" value="820" />
    </div>
    <div class="row">
      <div class="label-row"><span>Move Speed</span><span id="v-speed">460</span></div>
      <input type="range" id="s-speed" min="150" max="1200" step="10" value="460" />
    </div>
    <div class="row">
      <div class="label-row"><span>Acceleration</span><span id="v-accel">3600</span></div>
      <input type="range" id="s-accel" min="500" max="10000" step="100" value="3600" />
    </div>
    <div class="row">
      <div class="label-row"><span>Ground Friction</span><span id="v-friction">3200</span></div>
      <input type="range" id="s-friction" min="200" max="10000" step="100" value="3200" />
    </div>
    <div class="row">
      <div class="label-row"><span>Dash Impulse</span><span id="v-dash">1050</span></div>
      <input type="range" id="s-dash" min="400" max="2400" step="50" value="1050" />
    </div>
    <div class="row">
      <div class="label-row"><span>Square Size</span><span id="v-size">36</span></div>
      <input type="range" id="s-size" min="14" max="100" step="2" value="36" />
    </div>
    <div class="btn-row">
      <button id="btn-grid">Grid: ON</button>
      <button id="btn-walls">Edges: WALL</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");

    window.addEventListener("contextmenu", (e) => e.preventDefault());

    let width = 0;
    let height = 0;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    const FLOOR_HEIGHT = 90;

    function getSurfaceY() {
      return height - FLOOR_HEIGHT;
    }

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    const cfg = {
      gravity: 2400,
      jumpForce: 820,
      maxSpeed: 460,
      accel: 3600,
      friction: 3200,
      airControl: 0.65,
      dashSpeed: 1050,
      dashCooldown: 0.4,
      size: 36,
      showGrid: true,
      wrapEdges: false
    };

    const player = {
      x: width / 2,
      y: getSurfaceY() - cfg.size / 2,
      vx: 0,
      vy: 0,
      grounded: true,
      coyoteTimer: 0,
      jumpBufferTimer: 0,
      dashTimer: 0,
      dashFlash: 0,
      scaleX: 1,
      scaleY: 1,
      facing: 1,
      trail: []
    };

    function resetPlayer() {
      player.x = width / 2;
      player.y = getSurfaceY() - cfg.size / 2;
      player.vx = 0;
      player.vy = 0;
      player.grounded = true;
      player.coyoteTimer = 0;
      player.jumpBufferTimer = 0;
      player.dashTimer = 0;
      player.dashFlash = 0;
      player.scaleX = 1;
      player.scaleY = 1;
      player.trail.length = 0;
    }

    const keys = new Set();

    window.addEventListener("keydown", (e) => {
      if (e.code === "Tab") {
        e.preventDefault();
        document.getElementById("panel").classList.toggle("open");
        return;
      }

      if (e.code === "KeyR") {
        resetPlayer();
        return;
      }

      if ((e.code === "Space" || e.code === "KeyW" || e.code === "ArrowUp") && !keys.has(e.code)) {
        player.jumpBufferTimer = 0.12;
      }

      if ((e.code === "ShiftLeft" || e.code === "ShiftRight") && !keys.has(e.code)) {
        triggerDash();
      }

      keys.add(e.code);
    });

    window.addEventListener("keyup", (e) => {
      // Variable jump height: release early to cut upward velocity
      if ((e.code === "Space" || e.code === "KeyW" || e.code === "ArrowUp") && player.vy < -180) {
        player.vy *= 0.55;
      }
      keys.delete(e.code);
    });

    window.addEventListener("blur", () => keys.clear());

    function getMoveX() {
      let ix = 0;
      if (keys.has("KeyA") || keys.has("ArrowLeft")) ix -= 1;
      if (keys.has("KeyD") || keys.has("ArrowRight")) ix += 1;
      if (ix !== 0) player.facing = ix;
      return ix;
    }

    function executeJump() {
      player.vy = -cfg.jumpForce;
      player.grounded = false;
      player.coyoteTimer = 0;
      player.jumpBufferTimer = 0;
      player.scaleX = 0.74;
      player.scaleY = 1.3;
    }

    function triggerDash() {
      if (player.dashTimer > 0) return;
      const ix = getMoveX();
      const dir = ix !== 0 ? ix : player.facing;

      player.vx = dir * cfg.dashSpeed;
      player.vy = Math.min(player.vy, 0) * 0.25;
      player.dashTimer = cfg.dashCooldown;
      player.dashFlash = 1;
      player.scaleX = 1.32;
      player.scaleY = 0.72;
    }

    function bindSlider(id, valId, key) {
      const el = document.getElementById(id);
      const out = document.getElementById(valId);
      el.addEventListener("input", () => {
        cfg[key] = Number(el.value);
        out.textContent = cfg[key];
      });
    }

    bindSlider("s-gravity", "v-gravity", "gravity");
    bindSlider("s-jump", "v-jump", "jumpForce");
    bindSlider("s-speed", "v-speed", "maxSpeed");
    bindSlider("s-accel", "v-accel", "accel");
    bindSlider("s-friction", "v-friction", "friction");
    bindSlider("s-dash", "v-dash", "dashSpeed");
    bindSlider("s-size", "v-size", "size");

    const btnGrid = document.getElementById("btn-grid");
    btnGrid.addEventListener("click", () => {
      cfg.showGrid = !cfg.showGrid;
      btnGrid.textContent = `Grid: ${cfg.showGrid ? "ON" : "OFF"}`;
    });

    const btnWalls = document.getElementById("btn-walls");
    btnWalls.addEventListener("click", () => {
      cfg.wrapEdges = !cfg.wrapEdges;
      btnWalls.textContent = `Edges: ${cfg.wrapEdges ? "WRAP" : "WALL"}`;
    });

    let lastTime = performance.now();

    function update(dt) {
      if (player.dashTimer > 0) player.dashTimer = Math.max(0, player.dashTimer - dt);
      if (player.dashFlash > 0) player.dashFlash = Math.max(0, player.dashFlash - dt * 4);
      if (player.coyoteTimer > 0) player.coyoteTimer = Math.max(0, player.coyoteTimer - dt);
      if (player.jumpBufferTimer > 0) player.jumpBufferTimer = Math.max(0, player.jumpBufferTimer - dt);

      const ix = getMoveX();
      const controlMult = player.grounded ? 1 : cfg.airControl;

      // Horizontal movement
      if (ix !== 0) {
        player.vx += ix * cfg.accel * controlMult * dt;
        if (Math.abs(player.vx) > cfg.maxSpeed) {
          const sign = Math.sign(player.vx);
          const nextSpeed = Math.max(cfg.maxSpeed, Math.abs(player.vx) - cfg.friction * 1.4 * dt);
          player.vx = sign * nextSpeed;
        }
      } else {
        const drag = player.grounded ? cfg.friction : cfg.friction * 0.35;
        const speed = Math.abs(player.vx);
        if (speed > 0) {
          const nextSpeed = Math.max(0, speed - drag * dt);
          player.vx = Math.sign(player.vx) * nextSpeed;
        }
      }

      // Jump check (coyote time + input buffer)
      if (player.jumpBufferTimer > 0 && (player.grounded || player.coyoteTimer > 0)) {
        executeJump();
      }

      // Gravity
      player.vy += cfg.gravity * dt;

      // Integrate position
      player.x += player.vx * dt;
      player.y += player.vy * dt;

      const half = cfg.size / 2;
      const surfaceY = getSurfaceY();
      const wasGrounded = player.grounded;

      // Surface collision
      if (player.y + half >= surfaceY) {
        if (!wasGrounded && player.vy > 140) {
          const impact = Math.min(player.vy / 1200, 1);
          player.scaleX = 1 + 0.32 * impact;
          player.scaleY = 1 - 0.26 * impact;
        }
        player.y = surfaceY - half;
        player.vy = 0;
        player.grounded = true;
        player.coyoteTimer = 0.1;
      } else {
        if (wasGrounded) {
          player.coyoteTimer = 0.1;
        }
        player.grounded = false;
      }

      // Ceiling collision
      if (player.y - half < 0) {
        player.y = half;
        if (player.vy < 0) player.vy = 0;
      }

      // Left / Right screen edges
      if (cfg.wrapEdges) {
        if (player.x < -half) player.x = width + half;
        if (player.x > width + half) player.x = -half;
      } else {
        if (player.x < half) {
          player.x = half;
          if (player.vx < 0) player.vx = 0;
        } else if (player.x > width - half) {
          player.x = width - half;
          if (player.vx > 0) player.vx = 0;
        }
      }

      // Recover squash/stretch
      const spring = 1 - Math.exp(-18 * dt);
      player.scaleX += (1 - player.scaleX) * spring;
      player.scaleY += (1 - player.scaleY) * spring;

      // Trail recording
      const currentSpeed = Math.hypot(player.vx, player.vy);
      if (currentSpeed > 60) {
        player.trail.push({ x: player.x, y: player.y, alpha: 0.25 });
        if (player.trail.length > 14) player.trail.shift();
      }
      for (let i = player.trail.length - 1; i >= 0; i--) {
        player.trail[i].alpha -= dt * 1.4;
        if (player.trail[i].alpha <= 0) player.trail.splice(i, 1);
      }
    }

    function draw() {
      const surfaceY = getSurfaceY();

      ctx.fillStyle = "#0d0f12";
      ctx.fillRect(0, 0, width, height);

      // Reference grid
      if (cfg.showGrid) {
        const step = 48;
        ctx.strokeStyle = "rgba(255, 255, 255, 0.035)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = 0; x <= width; x += step) {
          ctx.moveTo(x, 0);
          ctx.lineTo(x, surfaceY);
        }
        for (let y = surfaceY; y >= 0; y -= step) {
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
        }
        ctx.stroke();
      }

      // Solid Surface
      ctx.fillStyle = "#161a20";
      ctx.fillRect(0, surfaceY, width, FLOOR_HEIGHT);

      ctx.strokeStyle = "rgba(255, 255, 255, 0.22)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, surfaceY);
      ctx.lineTo(width, surfaceY);
      ctx.stroke();

      // Motion trail
      for (let i = 0; i < player.trail.length; i++) {
        const t = player.trail[i];
        const ratio = (i + 1) / player.trail.length;
        const s = cfg.size * (0.65 + 0.35 * ratio);
        ctx.fillStyle = `rgba(255, 255, 255, ${t.alpha * 0.42})`;
        ctx.fillRect(t.x - s / 2, t.y - s / 2, s, s);
      }

      // The Square (anchored cleanly at bottom edge for squash/stretch)
      ctx.save();
      ctx.translate(player.x, player.y + cfg.size / 2);
      ctx.scale(player.scaleX, player.scaleY);

      if (player.dashFlash > 0) {
        ctx.shadowColor = "rgba(255, 255, 255, 0.65)";
        ctx.shadowBlur = 18 * player.dashFlash;
      }

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(-cfg.size / 2, -cfg.size, cfg.size, cfg.size);
      ctx.restore();
    }

    function loop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
