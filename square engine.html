<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Square</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d0f12;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #c9d1d9;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #hud {
      position: fixed;
      top: 14px;
      left: 14px;
      font-size: 12px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.45);
      pointer-events: none;
    }

    #coords {
      margin-top: 2px;
      color: rgba(255, 255, 255, 0.3);
    }

    #panel {
      position: fixed;
      top: 14px;
      right: 14px;
      width: 255px;
      background: rgba(18, 21, 27, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
      display: none;
    }

    #panel.open {
      display: block;
    }

    .row {
      margin-bottom: 9px;
    }

    .row:last-child {
      margin-bottom: 0;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 3px;
      color: #9ba3af;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #ffffff;
      cursor: pointer;
    }

    .btn-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    button {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e5e7eb;
      padding: 5px 8px;
      border-radius: 5px;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.16);
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="hud">
    A / D or Arrows: Move &nbsp;|&nbsp; W / Up / Space: Jump &nbsp;|&nbsp; Shift: Dash &nbsp;|&nbsp; Tab: Tuner &nbsp;|&nbsp; R: Respawn &nbsp;|&nbsp; N: New Seed
    <div id="coords">X: 0 &nbsp;|&nbsp; Seed: 0</div>
  </div>

  <div id="panel">
    <div class="row">
      <div class="label-row"><span>Terrain Roughness</span><span id="v-rough">110</span></div>
      <input type="range" id="s-rough" min="0" max="260" step="10" value="110" />
    </div>
    <div class="row">
      <div class="label-row"><span>Platform Density</span><span id="v-plat">0.55</span></div>
      <input type="range" id="s-plat" min="0" max="1" step="0.05" value="0.55" />
    </div>
    <div class="row">
      <div class="label-row"><span>Gap Frequency</span><span id="v-gap">0.15</span></div>
      <input type="range" id="s-gap" min="0" max="0.6" step="0.05" value="0.15" />
    </div>
    <div class="row">
      <div class="label-row"><span>Gravity</span><span id="v-gravity">2400</span></div>
      <input type="range" id="s-gravity" min="400" max="6000" step="100" value="2400" />
    </div>
    <div class="row">
      <div class="label-row"><span>Jump Force</span><span id="v-jump">860</span></div>
      <input type="range" id="s-jump" min="200" max="1800" step="20" value="860" />
    </div>
    <div class="row">
      <div class="label-row"><span>Move Speed</span><span id="v-speed">480</span></div>
      <input type="range" id="s-speed" min="150" max="1200" step="10" value="480" />
    </div>
    <div class="row">
      <div class="label-row"><span>Dash Impulse</span><span id="v-dash">1100</span></div>
      <input type="range" id="s-dash" min="400" max="2400" step="50" value="1100" />
    </div>
    <div class="btn-row">
      <button id="btn-grid">Grid: ON</button>
      <button id="btn-seed">New Seed</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const coordsEl = document.getElementById("coords");

    window.addEventListener("contextmenu", (e) => e.preventDefault());

    let width = 0;
    let height = 0;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    const cfg = {
      seed: Math.floor(Math.random() * 999999) + 1,
      roughness: 110,
      platformDensity: 0.55,
      gapChance: 0.15,
      gravity: 2400,
      jumpForce: 860,
      maxSpeed: 480,
      accel: 3800,
      friction: 3400,
      airControl: 0.68,
      dashSpeed: 1100,
      dashCooldown: 0.38,
      size: 36,
      showGrid: true
    };

    // Deterministic Hashing & 1D Value Noise
    function hash(n) {
      let x = Math.sin(n * 127.1 + cfg.seed * 311.7) * 43758.5453123;
      return x - Math.floor(x);
    }

    function smoothNoise(x) {
      const i = Math.floor(x);
      const f = x - i;
      const u = f * f * (3 - 2 * f);
      return hash(i) * (1 - u) + hash(i + 1) * u;
    }

    function fbm(x) {
      let val = 0;
      let amp = 0.55;
      let freq = 1;
      for (let o = 0; o < 3; o++) {
        val += smoothNoise(x * freq) * amp;
        freq *= 2.05;
        amp *= 0.45;
      }
      return val; // ~0..1
    }

    // Chunked World Generation
    const TILE_W = 64;
    const CHUNK_TILES = 16;
    const CHUNK_W = TILE_W * CHUNK_TILES;
    const chunks = new Map();

    function getBaseGroundY() {
      return height * 0.72;
    }

    function generateChunk(chunkIndex) {
      const blocks = [];
      const baseGroundY = getBaseGroundY();
      const startTile = chunkIndex * CHUNK_TILES;

      let prevSurfaceY = null;

      for (let i = 0; i < CHUNK_TILES; i++) {
        const tx = startTile + i;
        const wx = tx * TILE_W;

        // Keep spawn area (around x = 0) safe and flat
        const nearSpawn = Math.abs(tx) <= 3;

        // Gap check
        const gapRoll = hash(tx * 7.3 + 19);
        const isGap = !nearSpawn && gapRoll < cfg.gapChance && i > 0 && i < CHUNK_TILES - 1;

        if (isGap) {
          prevSurfaceY = null;
          continue;
        }

        // Terrain elevation
        const n = fbm(tx * 0.14);
        const offset = nearSpawn ? 0 : (n - 0.5) * 2 * cfg.roughness;
        const surfaceY = Math.round((baseGroundY + offset) / 16) * 16;

        blocks.push({
          x: wx,
          y: surfaceY,
          w: TILE_W,
          h: 2000,
          type: "ground"
        });

        // Floating platforms
        if (!nearSpawn && i % 2 === 0) {
          const platRoll = hash(tx * 13.7 + 91);
          if (platRoll < cfg.platformDensity) {
            const tier = hash(tx * 3.1 + 41) > 0.45 ? 1 : 2;
            const platY = surfaceY - (115 * tier + Math.round(hash(tx * 5.9) * 32));
            const platSpan = hash(tx * 17.3) > 0.5 ? 2 : 3;

            blocks.push({
              x: wx,
              y: platY,
              w: TILE_W * platSpan,
              h: 18,
              type: "platform"
            });
          }
        }

        prevSurfaceY = surfaceY;
      }

      return blocks;
    }

    function getChunk(chunkIndex) {
      if (!chunks.has(chunkIndex)) {
        chunks.set(chunkIndex, generateChunk(chunkIndex));
      }
      return chunks.get(chunkIndex);
    }

    function getNearbySolids(minX, maxX) {
      const cStart = Math.floor(minX / CHUNK_W) - 1;
      const cEnd = Math.floor(maxX / CHUNK_W) + 1;
      const list = [];
      for (let c = cStart; c <= cEnd; c++) {
        const blocks = getChunk(c);
        for (let i = 0; i < blocks.length; i++) {
          list.push(blocks[i]);
        }
      }
      return list;
    }

    function rebuildWorld() {
      chunks.clear();
    }

    // Player State
    const player = {
      x: 0,
      y: getBaseGroundY() - cfg.size / 2,
      vx: 0,
      vy: 0,
      grounded: false,
      coyoteTimer: 0,
      jumpBufferTimer: 0,
      dashTimer: 0,
      dashFlash: 0,
      scaleX: 1,
      scaleY: 1,
      facing: 1,
      trail: []
    };

    const camera = {
      x: 0,
      y: getBaseGroundY() - height * 0.55
    };

    function respawnPlayer() {
      player.x = 0;
      player.y = getBaseGroundY() - cfg.size / 2 - 4;
      player.vx = 0;
      player.vy = 0;
      player.grounded = false;
      player.coyoteTimer = 0;
      player.jumpBufferTimer = 0;
      player.dashTimer = 0;
      player.dashFlash = 0;
      player.scaleX = 1;
      player.scaleY = 1;
      player.trail.length = 0;
      camera.x = player.x;
      camera.y = player.y - height * 0.1;
    }

    function newSeed() {
      cfg.seed = Math.floor(Math.random() * 999999) + 1;
      rebuildWorld();
      respawnPlayer();
    }

    // Input Handling
    const keys = new Set();

    window.addEventListener("keydown", (e) => {
      if (e.code === "Tab") {
        e.preventDefault();
        document.getElementById("panel").classList.toggle("open");
        return;
      }
      if (e.code === "KeyR") {
        respawnPlayer();
        return;
      }
      if (e.code === "KeyN") {
        newSeed();
        return;
      }
      if ((e.code === "Space" || e.code === "KeyW" || e.code === "ArrowUp") && !keys.has(e.code)) {
        player.jumpBufferTimer = 0.12;
      }
      if ((e.code === "ShiftLeft" || e.code === "ShiftRight") && !keys.has(e.code)) {
        triggerDash();
      }
      keys.add(e.code);
    });

    window.addEventListener("keyup", (e) => {
      if ((e.code === "Space" || e.code === "KeyW" || e.code === "ArrowUp") && player.vy < -180) {
        player.vy *= 0.55;
      }
      keys.delete(e.code);
    });

    window.addEventListener("blur", () => keys.clear());

    function getMoveX() {
      let ix = 0;
      if (keys.has("KeyA") || keys.has("ArrowLeft")) ix -= 1;
      if (keys.has("KeyD") || keys.has("ArrowRight")) ix += 1;
      if (ix !== 0) player.facing = ix;
      return ix;
    }

    function executeJump() {
      player.vy = -cfg.jumpForce;
      player.grounded = false;
      player.coyoteTimer = 0;
      player.jumpBufferTimer = 0;
      player.scaleX = 0.74;
      player.scaleY = 1.3;
    }

    function triggerDash() {
      if (player.dashTimer > 0) return;
      const ix = getMoveX();
      const dir = ix !== 0 ? ix : player.facing;

      player.vx = dir * cfg.dashSpeed;
      player.vy = Math.min(player.vy, 0) * 0.25;
      player.dashTimer = cfg.dashCooldown;
      player.dashFlash = 1;
      player.scaleX = 1.32;
      player.scaleY = 0.72;
    }

    // Tuner UI Bindings
    function bindSlider(id, valId, key, rebuild = false) {
      const el = document.getElementById(id);
      const out = document.getElementById(valId);
      el.addEventListener("input", () => {
        cfg[key] = Number(el.value);
        out.textContent = cfg[key];
        if (rebuild) rebuildWorld();
      });
    }

    bindSlider("s-rough", "v-rough", "roughness", true);
    bindSlider("s-plat", "v-plat", "platformDensity", true);
    bindSlider("s-gap", "v-gap", "gapChance", true);
    bindSlider("s-gravity", "v-gravity", "gravity");
    bindSlider("s-jump", "v-jump", "jumpForce");
    bindSlider("s-speed", "v-speed", "maxSpeed");
    bindSlider("s-dash", "v-dash", "dashSpeed");

    const btnGrid = document.getElementById("btn-grid");
    btnGrid.addEventListener("click", () => {
      cfg.showGrid = !cfg.showGrid;
      btnGrid.textContent = `Grid: ${cfg.showGrid ? "ON" : "OFF"}`;
    });

    document.getElementById("btn-seed").addEventListener("click", newSeed);

    // Axis-Aligned Bounding Box Collision Resolution
    function aabbOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
      return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
    }

    let lastTime = performance.now();

    function update(dt) {
      if (player.dashTimer > 0) player.dashTimer = Math.max(0, player.dashTimer - dt);
      if (player.dashFlash > 0) player.dashFlash = Math.max(0, player.dashFlash - dt * 4);
      if (player.coyoteTimer > 0) player.coyoteTimer = Math.max(0, player.coyoteTimer - dt);
      if (player.jumpBufferTimer > 0) player.jumpBufferTimer = Math.max(0, player.jumpBufferTimer - dt);

      const ix = getMoveX();
      const controlMult = player.grounded ? 1 : cfg.airControl;

      // Horizontal acceleration & friction
      if (ix !== 0) {
        player.vx += ix * cfg.accel * controlMult * dt;
        if (Math.abs(player.vx) > cfg.maxSpeed) {
          const sign = Math.sign(player.vx);
          const nextSpeed = Math.max(cfg.maxSpeed, Math.abs(player.vx) - cfg.friction * 1.4 * dt);
          player.vx = sign * nextSpeed;
        }
      } else {
        const drag = player.grounded ? cfg.friction : cfg.friction * 0.35;
        const speed = Math.abs(player.vx);
        if (speed > 0) {
          const nextSpeed = Math.max(0, speed - drag * dt);
          player.vx = Math.sign(player.vx) * nextSpeed;
        }
      }

      if (player.jumpBufferTimer > 0 && (player.grounded || player.coyoteTimer > 0)) {
        executeJump();
      }

      // Gravity
      player.vy += cfg.gravity * dt;

      const half = cfg.size / 2;
      const solids = getNearbySolids(player.x - 200, player.x + 200);

      // Step X & resolve horizontal collisions
      player.x += player.vx * dt;
      for (let i = 0; i < solids.length; i++) {
        const s = solids[i];
        if (aabbOverlap(player.x - half, player.y - half, cfg.size, cfg.size, s.x, s.y, s.w, s.h)) {
          if (player.vx > 0) {
            player.x = s.x - half;
            player.vx = 0;
          } else if (player.vx < 0) {
            player.x = s.x + s.w + half;
            player.vx = 0;
          }
        }
      }

      // Step Y & resolve vertical collisions
      const wasGrounded = player.grounded;
      player.grounded = false;
      player.y += player.vy * dt;

      for (let i = 0; i < solids.length; i++) {
        const s = solids[i];
        if (aabbOverlap(player.x - half, player.y - half, cfg.size, cfg.size, s.x, s.y, s.w, s.h)) {
          if (player.vy > 0) {
            if (!wasGrounded && player.vy > 140) {
              const impact = Math.min(player.vy / 1200, 1);
              player.scaleX = 1 + 0.32 * impact;
              player.scaleY = 1 - 0.26 * impact;
            }
            player.y = s.y - half;
            player.vy = 0;
            player.grounded = true;
            player.coyoteTimer = 0.1;
          } else if (player.vy < 0) {
            player.y = s.y + s.h + half;
            player.vy = 0;
          }
        }
      }

      if (wasGrounded && !player.grounded && player.vy >= 0) {
        player.coyoteTimer = 0.1;
      }

      // Respawn if fallen into a gap
      if (player.y > getBaseGroundY() + 850) {
        respawnPlayer();
        return;
      }

      // Smooth camera tracking
      const camLerp = 1 - Math.exp(-9 * dt);
      const lookAheadX = player.vx * 0.22;
      camera.x += (player.x + lookAheadX - camera.x) * camLerp;
      camera.y += (player.y - height * 0.08 - camera.y) * (1 - Math.exp(-6 * dt));

      // Recover squash/stretch
      const spring = 1 - Math.exp(-18 * dt);
      player.scaleX += (1 - player.scaleX) * spring;
      player.scaleY += (1 - player.scaleY) * spring;

      // Trail recording
      const currentSpeed = Math.hypot(player.vx, player.vy);
      if (currentSpeed > 60) {
        player.trail.push({ x: player.x, y: player.y, alpha: 0.24 });
        if (player.trail.length > 14) player.trail.shift();
      }
      for (let i = player.trail.length - 1; i >= 0; i--) {
        player.trail[i].alpha -= dt * 1.4;
        if (player.trail[i].alpha <= 0) player.trail.splice(i, 1);
      }

      coordsEl.textContent = `X: ${Math.round(player.x / TILE_W)}m  |  Seed: ${cfg.seed}`;
    }

    function draw() {
      ctx.fillStyle = "#0d0f12";
      ctx.fillRect(0, 0, width, height);

      const camLeft = camera.x - width / 2;
      const camTop = camera.y - height / 2;

      // Parallax Grid
      if (cfg.showGrid) {
        const step = 64;
        const startX = -((camLeft % step) + step) % step;
        const startY = -((camTop % step) + step) % step;

        ctx.strokeStyle = "rgba(255, 255, 255, 0.032)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = startX; x <= width; x += step) {
          ctx.moveTo(x, 0);
          ctx.lineTo(x, height);
        }
        for (let y = startY; y <= height; y += step) {
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
        }
        ctx.stroke();
      }

      ctx.save();
      ctx.translate(-camLeft, -camTop);

      // Render Visible World Chunks
      const visibleSolids = getNearbySolids(camLeft - 128, camLeft + width + 128);
      for (let i = 0; i < visibleSolids.length; i++) {
        const b = visibleSolids[i];
        if (b.type === "ground") {
          ctx.fillStyle = "#161a20";
          ctx.fillRect(b.x, b.y, b.w + 0.5, b.h);

          ctx.fillStyle = "rgba(255, 255, 255, 0.24)";
          ctx.fillRect(b.x, b.y, b.w + 0.5, 2);
        } else {
          ctx.fillStyle = "#1c2129";
          ctx.fillRect(b.x, b.y, b.w, b.h);

          ctx.strokeStyle = "rgba(255, 255, 255, 0.22)";
          ctx.lineWidth = 1.5;
          ctx.strokeRect(b.x, b.y, b.w, b.h);
        }
      }

      // Motion Trail
      for (let i = 0; i < player.trail.length; i++) {
        const t = player.trail[i];
        const ratio = (i + 1) / player.trail.length;
        const s = cfg.size * (0.65 + 0.35 * ratio);
        ctx.fillStyle = `rgba(255, 255, 255, ${t.alpha * 0.42})`;
        ctx.fillRect(t.x - s / 2, t.y - s / 2, s, s);
      }

      // The Square
      ctx.save();
      ctx.translate(player.x, player.y + cfg.size / 2);
      ctx.scale(player.scaleX, player.scaleY);

      if (player.dashFlash > 0) {
        ctx.shadowColor = "rgba(255, 255, 255, 0.65)";
        ctx.shadowBlur = 18 * player.dashFlash;
      }

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(-cfg.size / 2, -cfg.size, cfg.size, cfg.size);
      ctx.restore();

      ctx.restore();
    }

    function loop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    respawnPlayer();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
