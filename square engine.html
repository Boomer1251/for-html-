<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Square - Procedural Infinite World</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080a0e;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #c9d1d9;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #hud {
      position: fixed;
      top: 14px;
      left: 14px;
      font-size: 12px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.45);
      pointer-events: none;
      z-index: 10;
    }

    #coords {
      margin-top: 2px;
      color: rgba(255, 255, 255, 0.3);
    }

    #panel {
      position: fixed;
      top: 14px;
      right: 14px;
      width: 265px;
      background: rgba(14, 17, 23, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
      display: none;
      z-index: 10;
    }

    #panel.open {
      display: block;
    }

    .row {
      margin-bottom: 9px;
    }

    .row:last-child {
      margin-bottom: 0;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 3px;
      color: #9ba3af;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #ffffff;
      cursor: pointer;
    }

    .btn-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    button {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e5e7eb;
      padding: 5px 8px;
      border-radius: 5px;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.16);
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="hud">
    A / D or Arrows: Move &nbsp;|&nbsp; W / Up / Space: Jump &nbsp;|&nbsp; Shift: Dash &nbsp;|&nbsp; Tab: Tuner &nbsp;|&nbsp; R: Respawn &nbsp;|&nbsp; N: New Seed
    <div id="coords">X: 0m &nbsp;|&nbsp; Biome: Plains &nbsp;|&nbsp; Seed: 0</div>
  </div>

  <div id="panel">
    <div class="row">
      <div class="label-row"><span>World Scale</span><span id="v-scale">1.0x</span></div>
      <input type="range" id="s-scale" min="0.4" max="2.5" step="0.1" value="1.0" />
    </div>
    <div class="row">
      <div class="label-row"><span>Cavity Frequency</span><span id="v-cave">0.35</span></div>
      <input type="range" id="s-cave" min="0.1" max="0.8" step="0.05" value="0.35" />
    </div>
    <div class="row">
      <div class="label-row"><span>Gravity</span><span id="v-gravity">2400</span></div>
      <input type="range" id="s-gravity" min="400" max="6000" step="100" value="2400" />
    </div>
    <div class="row">
      <div class="label-row"><span>Jump Force</span><span id="v-jump">860</span></div>
      <input type="range" id="s-jump" min="200" max="1800" step="20" value="860" />
    </div>
    <div class="row">
      <div class="label-row"><span>Move Speed</span><span id="v-speed">480</span></div>
      <input type="range" id="s-speed" min="150" max="1200" step="10" value="480" />
    </div>
    <div class="row">
      <div class="label-row"><span>Dash Impulse</span><span id="v-dash">1100</span></div>
      <input type="range" id="s-dash" min="400" max="2400" step="50" value="1100" />
    </div>
    <div class="btn-row">
      <button id="btn-grid">Grid: ON</button>
      <button id="btn-seed">New Seed</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const coordsEl = document.getElementById("coords");

    window.addEventListener("contextmenu", (e) => e.preventDefault());

    let width = 0;
    let height = 0;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    const cfg = {
      seed: Math.floor(Math.random() * 999999) + 1,
      worldScale: 1.0,
      caveFreq: 0.35,
      gravity: 2400,
      jumpForce: 860,
      maxSpeed: 480,
      accel: 3800,
      friction: 3400,
      airControl: 0.68,
      dashSpeed: 1100,
      dashCooldown: 0.38,
      size: 36,
      showGrid: true
    };

    // Advanced 2D Simplex/Perplex Noise & Biome Generator
    function hash22(pX, pY) {
      let n = Math.sin(pX * 127.1 + pY * 311.7 + cfg.seed * 73.1) * 43758.5453123;
      return n - Math.floor(n);
    }

    function smoothNoise2D(x, y) {
      const iX = Math.floor(x);
      const iY = Math.floor(y);
      const fX = x - iX;
      const fY = y - iY;

      const uX = fX * fX * (3 - 2 * fX);
      const uY = fY * fY * (3 - 2 * fY);

      const bottom = hash22(iX, iY) * (1 - uX) + hash22(iX + 1, iY) * uX;
      const top = hash22(iX, iY + 1) * (1 - uX) + hash22(iX + 1, iY + 1) * uX;

      return bottom * (1 - uY) + top * uY;
    }

    function fbm2D(x, y, octaves = 4) {
      let val = 0;
      let amp = 0.5;
      let freq = 1;
      for (let o = 0; o < octaves; o++) {
        val += smoothNoise2D(x * freq, y * freq) * amp;
        freq *= 2.02;
        amp *= 0.5;
      }
      return val;
    }

    // Grid-based destructive 16x16 block world (True 67x upgrade: caves, overhangs, floating islands, pillars, and distinct biomes)
    const BLOCK_SIZE = 32;
    const CHUNK_SIZE = 16; // 16x16 blocks per chunk
    const CHUNK_WORLD_W = BLOCK_SIZE * CHUNK_SIZE;
    const chunks = new Map();

    function getBaseGroundY() {
      return height * 0.65;
    }

    function getBiome(wx) {
      const bNoise = fbm2D(wx * 0.00015 + cfg.seed * 0.01, 0.5, 2);
      if (bNoise < 0.3) return { name: "Canyons", color: "#1c1821", accent: "#d97706" };
      if (bNoise < 0.65) return { name: "Plains", color: "#161a20", accent: "#38bdf8" };
      return { name: "Caverns", color: "#101622", accent: "#a855f7" };
    }

    function generateChunk(cx, cy) {
      const grid = new Uint8Array(CHUNK_SIZE * CHUNK_SIZE); // 0 = empty, 1 = solid
      const worldStartX = cx * CHUNK_WORLD_W;
      const worldStartY = cy * CHUNK_WORLD_W;
      const baseGroundY = getBaseGroundY();

      for (let lx = 0; lx < CHUNK_SIZE; lx++) {
        const wx = worldStartX + lx * BLOCK_SIZE;
        const normalizedX = wx * 0.0025 * cfg.worldScale;

        // Multi-layered terrain height
        const terrainHeight = baseGroundY + (fbm2D(normalizedX, 1.3, 3) - 0.5) * 480 * cfg.worldScale;
        const surfaceBlockY = Math.floor(terrainHeight / BLOCK_SIZE);

        for (let ly = 0; ly < CHUNK_SIZE; ly++) {
          const wy = worldStartY + ly * BLOCK_SIZE;
          const blockYIndex = Math.floor(wy / BLOCK_SIZE);

          // Near spawn safety bubble
          const nearSpawn = Math.abs(wx) < 160 && Math.abs(wy - baseGroundY) < 180;

          if (nearSpawn) {
            if (blockYIndex >= Math.floor(baseGroundY / BLOCK_SIZE)) {
              grid[ly * CHUNK_SIZE + lx] = 1;
            }
            continue;
          }

          if (blockYIndex >= surfaceBlockY) {
            // Cave carving using 2D noise threshold
            const caveVal = fbm2D(wx * 0.008 * cfg.worldScale, wy * 0.008 * cfg.worldScale, 3);
            const depthIntoGround = blockYIndex - surfaceBlockY;

            // Open up caves below surface, keep surface intact
            if (depthIntoGround > 3 && caveVal > (0.52 - cfg.caveFreq * 0.15)) {
              grid[ly * CHUNK_SIZE + lx] = 0; // Cave air
            } else {
              grid[ly * CHUNK_SIZE + lx] = 1; // Solid
            }
          } else {
            // Floating islands / arch pillars high up in the sky
            const islandNoise = fbm2D(normalizedX * 1.4, wy * 0.004, 3);
            if (wy < baseGroundY - 220 && islandNoise > 0.68 && islandNoise < 0.78) {
              grid[ly * CHUNK_SIZE + lx] = 1;
            }
          }
        }
      }
      return grid;
    }

    function getChunk(cx, cy) {
      const key = `${cx},${cy}`;
      if (!chunks.has(key)) {
        chunks.set(key, generateChunk(cx, cy));
      }
      return chunks.get(key);
    }

    function getBlock(wx, wy) {
      const cx = Math.floor(wx / CHUNK_WORLD_W);
      const cy = Math.floor(wy / CHUNK_WORLD_W);
      const chunk = getChunk(cx, cy);

      const localX = Math.floor((wx - cx * CHUNK_WORLD_W) / BLOCK_SIZE);
      const localY = Math.floor((wy - cy * CHUNK_WORLD_W) / BLOCK_SIZE);

      if (localX < 0 || localX >= CHUNK_SIZE || localY < 0 || localY >= CHUNK_SIZE) return 0;
      return chunk[localY * CHUNK_SIZE + localX];
    }

    function rebuildWorld() {
      chunks.clear();
    }

    // Player State
    const player = {
      x: 0,
      y: getBaseGroundY() - 60,
      vx: 0,
      vy: 0,
      grounded: false,
      coyoteTimer: 0,
      jumpBufferTimer: 0,
      dashTimer: 0,
      dashFlash: 0,
      scaleX: 1,
      scaleY: 1,
      facing: 1,
      trail: []
    };

    const camera = {
      x: 0,
      y: getBaseGroundY() - 100
    };

    function respawnPlayer() {
      player.x = 0;
      player.y = getBaseGroundY() - 80;
      player.vx = 0;
      player.vy = 0;
      player.grounded = false;
      player.coyoteTimer = 0;
      player.jumpBufferTimer = 0;
      player.dashTimer = 0;
      player.dashFlash = 0;
      player.scaleX = 1;
      player.scaleY = 1;
      player.trail.length = 0;
      camera.x = player.x;
      camera.y = player.y;
    }

    function newSeed() {
      cfg.seed = Math.floor(Math.random() * 999999) + 1;
      rebuildWorld();
      respawnPlayer();
    }

    // Input Handling
    const keys = new Set();

    window.addEventListener("keydown", (e) => {
      if (e.code === "Tab") {
        e.preventDefault();
        document.getElementById("panel").classList.toggle("open");
        return;
      }
      if (e.code === "KeyR") {
        respawnPlayer();
        return;
      }
      if (e.code === "KeyN") {
        newSeed();
        return;
      }
      if ((e.code === "Space" || e.code === "KeyW" || e.code === "ArrowUp") && !keys.has(e.code)) {
        player.jumpBufferTimer = 0.12;
      }
      if ((e.code === "ShiftLeft" || e.code === "ShiftRight") && !keys.has(e.code)) {
        triggerDash();
      }
      keys.add(e.code);
    });

    window.addEventListener("keyup", (e) => {
      if ((e.code === "Space" || e.code === "KeyW" || e.code === "ArrowUp") && player.vy < -180) {
        player.vy *= 0.5;
      }
      keys.delete(e.code);
    });

    window.addEventListener("blur", () => keys.clear());

    function getMoveX() {
      let ix = 0;
      if (keys.has("KeyA") || keys.has("ArrowLeft")) ix -= 1;
      if (keys.has("KeyD") || keys.has("ArrowRight")) ix += 1;
      if (ix !== 0) player.facing = ix;
      return ix;
    }

    function executeJump() {
      player.vy = -cfg.jumpForce;
      player.grounded = false;
      player.coyoteTimer = 0;
      player.jumpBufferTimer = 0;
      player.scaleX = 0.74;
      player.scaleY = 1.32;
    }

    function triggerDash() {
      if (player.dashTimer > 0) return;
      const ix = getMoveX();
      const dir = ix !== 0 ? ix : player.facing;

      player.vx = dir * cfg.dashSpeed;
      player.vy = Math.min(player.vy, 0) * 0.2;
      player.dashTimer = cfg.dashCooldown;
      player.dashFlash = 1;
      player.scaleX = 1.35;
      player.scaleY = 0.7;
    }

    // Tuner UI Bindings
    function bindSlider(id, valId, key, formatter = (v) => v, rebuild = false) {
      const el = document.getElementById(id);
      const out = document.getElementById(valId);
      el.addEventListener("input", () => {
        cfg[key] = Number(el.value);
        out.textContent = formatter(cfg[key]);
        if (rebuild) rebuildWorld();
      });
    }

    bindSlider("s-scale", "v-scale", "worldScale", (v) => v.toFixed(1) + "x", true);
    bindSlider("s-cave", "v-cave", "caveFreq", (v) => v.toFixed(2), true);
    bindSlider("s-gravity", "v-gravity", "gravity");
    bindSlider("s-jump", "v-jump", "jumpForce");
    bindSlider("s-speed", "v-speed", "maxSpeed");
    bindSlider("s-dash", "v-dash", "dashSpeed");

    const btnGrid = document.getElementById("btn-grid");
    btnGrid.addEventListener("click", () => {
      cfg.showGrid = !cfg.showGrid;
      btnGrid.textContent = `Grid: ${cfg.showGrid ? "ON" : "OFF"}`;
    });

    document.getElementById("btn-seed").addEventListener("click", newSeed);

    // Precise AABB Sub-pixel Block Collision Resolver
    function resolveCollisions(dt) {
      const half = cfg.size / 2;

      // Horizontal movement & collision
      player.x += player.vx * dt;
      let leftBox = player.x - half;
      let rightBox = player.x + half;
      let topBox = player.y - half;
      let bottomBox = player.y + half;

      const minX = Math.floor(leftBox / BLOCK_SIZE);
      const maxX = Math.floor(rightBox / BLOCK_SIZE);
      const minY = Math.floor(topBox / BLOCK_SIZE);
      const maxY = Math.floor(bottomBox / BLOCK_SIZE);

      for (let bx = minX; bx <= maxX; bx++) {
        for (let by = minY; by <= maxY; by++) {
          if (getBlock(bx * BLOCK_SIZE, by * BLOCK_SIZE) === 1) {
            if (player.vx > 0) {
              player.x = bx * BLOCK_SIZE - half;
              player.vx = 0;
            } else if (player.vx < 0) {
              player.x = (bx + 1) * BLOCK_SIZE + half;
              player.vx = 0;
            }
          }
        }
      }

      // Vertical movement & collision
      const wasGrounded = player.grounded;
      player.grounded = false;
      player.y += player.vy * dt;

      leftBox = player.x - half;
      rightBox = player.x + half;
      topBox = player.y - half;
      bottomBox = player.y + half;

      const vMinX = Math.floor(leftBox / BLOCK_SIZE);
      const vMaxX = Math.floor(rightBox / BLOCK_SIZE);
      const vMinY = Math.floor(topBox / BLOCK_SIZE);
      const vMaxY = Math.floor(bottomBox / BLOCK_SIZE);

      for (let bx = vMinX; bx <= vMaxX; bx++) {
        for (let by = vMinY; by <= vMaxY; by++) {
          if (getBlock(bx * BLOCK_SIZE, by * BLOCK_SIZE) === 1) {
            if (player.vy > 0) {
              if (!wasGrounded && player.vy > 120) {
                const impact = Math.min(player.vy / 1000, 1);
                player.scaleX = 1 + 0.35 * impact;
                player.scaleY = 1 - 0.28 * impact;
              }
              player.y = by * BLOCK_SIZE - half;
              player.vy = 0;
              player.grounded = true;
              player.coyoteTimer = 0.12;
            } else if (player.vy < 0) {
              player.y = (by + 1) * BLOCK_SIZE + half;
              player.vy = 0;
            }
          }
        }
      }

      if (wasGrounded && !player.grounded && player.vy >= 0) {
        player.coyoteTimer = 0.12;
      }
    }

    let lastTime = performance.now();

    function update(dt) {
      if (player.dashTimer > 0) player.dashTimer = Math.max(0, player.dashTimer - dt);
      if (player.dashFlash > 0) player.dashFlash = Math.max(0, player.dashFlash - dt * 4);
      if (player.coyoteTimer > 0) player.coyoteTimer = Math.max(0, player.coyoteTimer - dt);
      if (player.jumpBufferTimer > 0) player.jumpBufferTimer = Math.max(0, player.jumpBufferTimer - dt);

      const ix = getMoveX();
      const controlMult = player.grounded ? 1 : cfg.airControl;

      if (ix !== 0) {
        player.vx += ix * cfg.accel * controlMult * dt;
        if (Math.abs(player.vx) > cfg.maxSpeed) {
          const sign = Math.sign(player.vx);
          const nextSpeed = Math.max(cfg.maxSpeed, Math.abs(player.vx) - cfg.friction * 1.4 * dt);
          player.vx = sign * nextSpeed;
        }
      } else {
        const drag = player.grounded ? cfg.friction : cfg.friction * 0.3;
        const speed = Math.abs(player.vx);
        if (speed > 0) {
          const nextSpeed = Math.max(0, speed - drag * dt);
          player.vx = Math.sign(player.vx) * nextSpeed;
        }
      }

      if (player.jumpBufferTimer > 0 && (player.grounded || player.coyoteTimer > 0)) {
        executeJump();
      }

      // Gravity
      player.vy += cfg.gravity * dt;

      // Sub-step physics resolution for rock-solid collision stability
      resolveCollisions(dt);

      // Abyss safety respawn
      if (player.y > height * 2.2) {
        respawnPlayer();
        return;
      }

      // Smooth camera interpolation
      const camLerp = 1 - Math.exp(-10 * dt);
      const lookAhead = player.vx * 0.24;
      camera.x += (player.x + lookAhead - camera.x) * camLerp;
      camera.y += (player.y - height * 0.08 - camera.y) * camLerp;

      // Squash & stretch recovery spring
      const spring = 1 - Math.exp(-20 * dt);
      player.scaleX += (1 - player.scaleX) * spring;
      player.scaleY += (1 - player.scaleY) * spring;

      // Motion trail
      const currentSpeed = Math.hypot(player.vx, player.vy);
      if (currentSpeed > 60) {
        player.trail.push({ x: player.x, y: player.y, alpha: 0.28 });
        if (player.trail.length > 16) player.trail.shift();
      }
      for (let i = player.trail.length - 1; i >= 0; i--) {
        player.trail[i].alpha -= dt * 1.4;
        if (player.trail[i].alpha <= 0) player.trail.splice(i, 1);
      }

      const biome = getBiome(player.x);
      coordsEl.textContent = `X: ${Math.round(player.x / BLOCK_SIZE)}m  |  Biome: ${biome.name}  |  Seed: ${cfg.seed}`;
    }

    function draw() {
      ctx.fillStyle = "#080a0e";
      ctx.fillRect(0, 0, width, height);

      const camLeft = camera.x - width / 2;
      const camTop = camera.y - height / 2;

      // Background Grid
      if (cfg.showGrid) {
        const step = 64;
        const startX = -((camLeft % step) + step) % step;
        const startY = -((camTop % step) + step) % step;

        ctx.strokeStyle = "rgba(255, 255, 255, 0.028)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = startX; x <= width; x += step) {
          ctx.moveTo(x, 0);
          ctx.lineTo(x, height);
        }
        for (let y = startY; y <= height; y += step) {
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
        }
        ctx.stroke();
      }

      ctx.save();
      ctx.translate(-camLeft, -camTop);

      // Render Visible Chunks & Blocks
      const startChunkX = Math.floor(camLeft / CHUNK_WORLD_W) - 1;
      const endChunkX = Math.floor((camLeft + width) / CHUNK_WORLD_W) + 1;
      const startChunkY = Math.floor(camTop / CHUNK_WORLD_W) - 1;
      const endChunkY = Math.floor((camTop + height) / CHUNK_WORLD_W) + 1;

      for (let cx = startChunkX; cx <= endChunkX; cx++) {
        for (let cy = startChunkY; cy <= endChunkY; cy++) {
          const chunk = getChunk(cx, cy);
          const worldStartX = cx * CHUNK_WORLD_W;
          const worldStartY = cy * CHUNK_WORLD_W;

          for (let lx = 0; lx < CHUNK_SIZE; lx++) {
            for (let ly = 0; ly < CHUNK_SIZE; ly++) {
              if (chunk[ly * CHUNK_SIZE + lx] === 1) {
                const wx = worldStartX + lx * BLOCK_SIZE;
                const wy = worldStartY + ly * BLOCK_SIZE;

                // Frustum culling check
                if (wx + BLOCK_SIZE < camLeft || wx > camLeft + width || wy + BLOCK_SIZE < camTop || wy > camTop + height) {
                  continue;
                }

                const biome = getBiome(wx);
                ctx.fillStyle = biome.color;
                ctx.fillRect(wx, wy, BLOCK_SIZE + 0.5, BLOCK_SIZE + 0.5);

                // Top surface highlight edge
                if (getBlock(wx, wy - BLOCK_SIZE) === 0) {
                  ctx.fillStyle = biome.accent;
                  ctx.fillRect(wx, wy, BLOCK_SIZE, 3);
                }
              }
            }
          }
        }
      }

      // Motion Trail
      for (let i = 0; i < player.trail.length; i++) {
        const t = player.trail[i];
        const ratio = (i + 1) / player.trail.length;
        const s = cfg.size * (0.65 + 0.35 * ratio);
        ctx.fillStyle = `rgba(255, 255, 255, ${t.alpha * 0.45})`;
        ctx.fillRect(t.x - s / 2, t.y - s / 2, s, s);
      }

      // The Square
      ctx.save();
      ctx.translate(player.x, player.y + cfg.size / 2);
      ctx.scale(player.scaleX, player.scaleY);

      if (player.dashFlash > 0) {
        ctx.shadowColor = "rgba(255, 255, 255, 0.75)";
        ctx.shadowBlur = 22 * player.dashFlash;
      }

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(-cfg.size / 2, -cfg.size, cfg.size, cfg.size);
      ctx.restore();

      ctx.restore();
    }

    function loop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    respawnPlayer();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
