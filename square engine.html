<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Square</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d0f12;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #c9d1d9;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #hud {
      position: fixed;
      top: 14px;
      left: 14px;
      font-size: 12px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.45);
      pointer-events: none;
    }

    #coords {
      margin-top: 2px;
      color: rgba(255, 255, 255, 0.35);
    }

    #panel {
      position: fixed;
      top: 14px;
      right: 14px;
      width: 265px;
      background: rgba(18, 21, 27, 0.9);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 12px;
      font-size: 12px;
      display: none;
    }

    #panel.open {
      display: block;
    }

    .row {
      margin-bottom: 9px;
    }

    .row:last-child {
      margin-bottom: 0;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 3px;
      color: #9ba3af;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #ffffff;
      cursor: pointer;
    }

    .btn-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    button {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e5e7eb;
      padding: 5px 8px;
      border-radius: 5px;
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.16);
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div id="hud">
    A / D or Arrows: Move &nbsp;|&nbsp; W / Up / Space: Jump &nbsp;|&nbsp; S / Down: Drop &nbsp;|&nbsp; Shift: Dash &nbsp;|&nbsp; Tab: Tuner &nbsp;|&nbsp; R: Respawn &nbsp;|&nbsp; N: New Seed
    <div id="coords">X: 0m &nbsp;|&nbsp; Biome: Plains &nbsp;|&nbsp; Seed: 0</div>
  </div>

  <div id="panel">
    <div class="row">
      <div class="label-row"><span>Terrain Roughness</span><span id="v-rough">110</span></div>
      <input type="range" id="s-rough" min="0" max="260" step="10" value="110" />
    </div>
    <div class="row">
      <div class="label-row"><span>Platform Density</span><span id="v-plat">0.55</span></div>
      <input type="range" id="s-plat" min="0" max="1" step="0.05" value="0.55" />
    </div>
    <div class="row">
      <div class="label-row"><span>Gap Frequency</span><span id="v-gap">0.15</span></div>
      <input type="range" id="s-gap" min="0" max="0.6" step="0.05" value="0.15" />
    </div>
    <div class="row">
      <div class="label-row"><span>Gravity</span><span id="v-gravity">2400</span></div>
      <input type="range" id="s-gravity" min="400" max="6000" step="100" value="2400" />
    </div>
    <div class="row">
      <div class="label-row"><span>Jump Force</span><span id="v-jump">860</span></div>
      <input type="range" id="s-jump" min="200" max="1800" step="20" value="860" />
    </div>
    <div class="row">
      <div class="label-row"><span>Move Speed</span><span id="v-speed">480</span></div>
      <input type="range" id="s-speed" min="150" max="1200" step="10" value="480" />
    </div>
    <div class="row">
      <div class="label-row"><span>Dash Impulse</span><span id="v-dash">1100</span></div>
      <input type="range" id="s-dash" min="400" max="2400" step="50" value="1100" />
    </div>
    <div class="btn-row">
      <button id="btn-grid">Grid: ON</button>
      <button id="btn-seed">New Seed</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const coordsEl = document.getElementById("coords");

    window.addEventListener("contextmenu", (e) => e.preventDefault());

    let width = 0;
    let height = 0;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resize);
    resize();

    const cfg = {
      seed: Math.floor(Math.random() * 999999) + 1,
      roughness: 110,
      platformDensity: 0.55,
      gapChance: 0.15,
      gravity: 2400,
      jumpForce: 860,
      maxSpeed: 480,
      accel: 3800,
      friction: 3400,
      airControl: 0.68,
      dashSpeed: 1100,
      dashCooldown: 0.38,
      size: 36,
      showGrid: true
    };

    // Deterministic Hashing & Multi-Octave Noise
    function hash(n) {
      const x = Math.sin(n * 127.1 + cfg.seed * 311.7) * 43758.5453123;
      return x - Math.floor(x);
    }

    function hash2(a, b) {
      const x = Math.sin(a * 127.1 + b * 269.5 + cfg.seed * 311.7) * 43758.5453123;
      return x - Math.floor(x);
    }

    function smoothNoise(x) {
      const i = Math.floor(x);
      const f = x - i;
      const u = f * f * (3 - 2 * f);
      return hash(i) * (1 - u) + hash(i + 1) * u;
    }

    function fbm(x, octaves = 4) {
      let val = 0;
      let amp = 0.5;
      let freq = 1;
      let norm = 0;
      for (let o = 0; o < octaves; o++) {
        val += smoothNoise(x * freq) * amp;
        norm += amp;
        freq *= 2.03;
        amp *= 0.48;
      }
      return val / norm; // 0..1
    }

    function ridgedFbm(x, octaves = 3) {
      let val = 0;
      let amp = 0.5;
      let freq = 1;
      let norm = 0;
      for (let o = 0; o < octaves; o++) {
        const n = 1 - Math.abs(smoothNoise(x * freq) * 2 - 1);
        val += n * n * amp;
        norm += amp;
        freq *= 2.1;
        amp *= 0.5;
      }
      return val / norm;
    }

    // Biome System (Smooth transitions + distinct architectural profiles)
    const BIOMES = [
      { name: "Plains",    accent: "rgba(130, 210, 255, 0.28)", fill: "#151920", roughMult: 0.65, gapMult: 0.75, platMult: 0.85 },
      { name: "Monoliths", accent: "rgba(185, 155, 255, 0.30)", fill: "#171722", roughMult: 1.35, gapMult: 0.95, platMult: 1.15 },
      { name: "Chasms",    accent: "rgba(255, 150, 120, 0.30)", fill: "#1b161a", roughMult: 0.90, gapMult: 1.65, platMult: 1.35 },
      { name: "Skyspire",  accent: "rgba(120, 240, 195, 0.30)", fill: "#131c1e", roughMult: 1.15, gapMult: 1.15, platMult: 1.45 }
    ];

    function getBiomeAtTile(tx) {
      if (Math.abs(tx) <= 10) return BIOMES[0];
      const bVal = fbm(tx * 0.011 + 42.7, 2);
      const idx = Math.min(BIOMES.length - 1, Math.floor(bVal * BIOMES.length));
      return BIOMES[idx];
    }

    // Physics-Aware Reachability Helpers
    function getMaxJumpHeight() {
      return (cfg.jumpForce * cfg.jumpForce) / (2 * Math.max(cfg.gravity, 1));
    }

    function getMaxJumpSpan() {
      const airTime = (2 * cfg.jumpForce) / Math.max(cfg.gravity, 1);
      return cfg.maxSpeed * airTime + cfg.dashSpeed * 0.24;
    }

    // Chunked World Generation
    const TILE_W = 64;
    const CHUNK_TILES = 16;
    const CHUNK_W = TILE_W * CHUNK_TILES;
    const chunks = new Map();

    function getBaseGroundY() {
      return height * 0.72;
    }

    // Deterministic continuous surface height at any tile X (no chunk-seam cliffs)
    function computeRawSurfaceY(tx) {
      const baseGroundY = getBaseGroundY();
      if (Math.abs(tx) <= 4) return Math.round(baseGroundY / 16) * 16;

      // Smooth fade-in out of spawn safe zone
      const spawnFade = Math.min(1, Math.max(0, (Math.abs(tx) - 4) / 8));
      const biome = getBiomeAtTile(tx);

      // Macro elevation + micro detail + occasional terrace steps
      const macro = (fbm(tx * 0.045, 3) - 0.5) * 2.2;
      const micro = (fbm(tx * 0.18 + 13.1, 3) - 0.5) * 0.9;
      const ridge = (ridgedFbm(tx * 0.08 + 71.4, 2) - 0.5) * 0.8;

      let combined = macro + micro * 0.55 + ridge * 0.45;

      // Terracing in Monoliths biome for clean stepped architecture
      if (biome.name === "Monoliths") {
        combined = Math.round(combined * 3.5) / 3.5;
      }

      const rawOffset = combined * cfg.roughness * biome.roughMult * spawnFade;
      return Math.round((baseGroundY + rawOffset) / 16) * 16;
    }

    // Deterministic gap mask so chunks agree across boundaries
    function isTileGap(tx) {
      if (Math.abs(tx) <= 5) return false;
      const biome = getBiomeAtTile(tx);
      const effectiveGapChance = Math.min(0.65, cfg.gapChance * biome.gapMult);
      if (effectiveGapChance <= 0.01) return false;

      // Group gaps into multi-tile chasms (2 to 5 tiles wide) instead of random 1-tile pinholes
      const chasmCell = Math.floor(tx / 6);
      const cellRoll = hash(chasmCell * 19.31 + 7.7);
      if (cellRoll >= effectiveGapChance) return false;

      const maxJumpTiles = Math.max(2, Math.min(6, Math.floor((getMaxJumpSpan() * 0.78) / TILE_W)));
      const gapWidth = Math.min(maxJumpTiles, 2 + Math.floor(hash(chasmCell * 5.17 + 3.3) * 3));
      const gapStartInCell = 1 + Math.floor(hash(chasmCell * 11.9 + 2.1) * Math.max(1, 5 - gapWidth));
      const local = ((tx % 6) + 6) % 6;

      return local >= gapStartInCell && local < gapStartInCell + gapWidth;
    }

    function generateChunk(chunkIndex) {
      const blocks = [];
      const decor = [];
      const startTile = chunkIndex * CHUNK_TILES;
      const maxStepUp = Math.max(48, Math.floor(getMaxJumpHeight() * 0.78));

      // Precompute tile profiles across chunk + 1-tile neighbor margin
      const tiles = [];
      let lastSolidY = computeRawSurfaceY(startTile - 1);

      for (let i = -1; i <= CHUNK_TILES; i++) {
        const tx = startTile + i;
        const biome = getBiomeAtTile(tx);
        const gap = isTileGap(tx);
        let surfaceY = computeRawSurfaceY(tx);

        // Clamp vertical step between adjacent tiles so terrain is always climbable
        if (!gap) {
          if (lastSolidY - surfaceY > maxStepUp) {
            surfaceY = Math.round((lastSolidY - maxStepUp) / 16) * 16;
          }
          lastSolidY = surfaceY;
        }

        tiles.push({ tx, wx: tx * TILE_W, biome, gap, surfaceY });
      }

      // 1. Merge contiguous ground columns with identical surfaceY into clean wide blocks
      let runStart = null;
      for (let i = 1; i <= CHUNK_TILES; i++) {
        const t = tiles[i];
        if (t.gap) {
          if (runStart) {
            blocks.push(runStart);
            runStart = null;
          }
          continue;
        }

        if (runStart && runStart.y === t.surfaceY && runStart.biomeName === t.biome.name) {
          runStart.w += TILE_W;
        } else {
          if (runStart) blocks.push(runStart);
          runStart = {
            x: t.wx,
            y: t.surfaceY,
            w: TILE_W,
            h: 2200,
            type: "ground",
            accent: t.biome.accent,
            fill: t.biome.fill,
            biomeName: t.biome.name
          };
        }
      }
      if (runStart) blocks.push(runStart);

      // 2. Chasm Bridge Platforms & Stepping Stones (guarantees wide gaps are fun & traversable)
      let idx = 1;
      while (idx <= CHUNK_TILES) {
        const t = tiles[idx];
        if (!t.gap) {
          idx++;
          continue;
        }

        let gapEnd = idx;
        while (gapEnd <= CHUNK_TILES && tiles[gapEnd].gap) gapEnd++;
        const gapTiles = gapEnd - idx;
        const leftRefY = tiles[idx - 1].surfaceY;
        const rightRefY = tiles[Math.min(tiles.length - 1, gapEnd)].surfaceY;
        const midY = Math.round(((leftRefY + rightRefY) * 0.5) / 16) * 16;

        if (gapTiles >= 3) {
          const bridgeX = t.wx + Math.floor(gapTiles * 0.5) * TILE_W - TILE_W * 0.5;
          blocks.push({
            x: bridgeX,
            y: midY - 16,
            w: TILE_W * 1.5,
            h: 16,
            type: "platform",
            oneWay: true,
            accent: t.biome.accent
          });
        }
        idx = gapEnd;
      }

      // 3. Multi-Tier Parkour Routes, Bounce Pads & Sky Islands
      const maxJumpH = getMaxJumpHeight();
      const tierStep = Math.max(88, Math.min(132, Math.round((maxJumpH * 0.72) / 16) * 16));

      for (let i = 1; i <= CHUNK_TILES; i++) {
        const t = tiles[i];
        if (Math.abs(t.tx) <= 4) continue;

        const effectivePlat = Math.min(1, cfg.platformDensity * t.biome.platMult);
        const routeRoll = hash(t.tx * 13.7 + 91.3);

        // Elevated multi-step parkour chains every few tiles
        if (t.tx % 3 === 0 && routeRoll < effectivePlat) {
          const chainLen = 1 + Math.floor(hash(t.tx * 7.1 + 12) * 3); // 1 to 3 connected platforms
          let curX = t.wx;
          let curY = t.surfaceY - tierStep;

          for (let step = 0; step < chainLen; step++) {
            const spanTiles = 2 + Math.floor(hash2(t.tx, step * 19 + 3) * 2); // 2 or 3 tiles wide
            const w = spanTiles * TILE_W;

            blocks.push({
              x: curX,
              y: curY,
              w,
              h: 16,
              type: "platform",
              oneWay: true,
              accent: t.biome.accent
            });

            // High-altitude Skyspire bonus island above tall chains
            if (step === chainLen - 1 && t.biome.name === "Skyspire" && hash2(t.tx, 99) > 0.45) {
              blocks.push({
                x: curX + TILE_W * 0.5,
                y: curY - tierStep,
                w: TILE_W * 2,
                h: 16,
                type: "platform",
                oneWay: true,
                accent: t.biome.accent
              });
            }

            const dir = hash2(t.tx, step + 7) > 0.25 ? 1 : -1;
            curX += dir * (w + TILE_W * (1 + Math.floor(hash2(t.tx, step + 31) * 1.5)));
            curY -= tierStep * (hash2(t.tx, step + 53) > 0.35 ? 1 : 0);
          }
        }

        // Launch / Bounce Pads on flat ground before high cliffs or in Skyspire/Monoliths
        if (!t.gap && t.tx % 7 === 0 && hash(t.tx * 23.1 + 5) < 0.22 * effectivePlat) {
          blocks.push({
            x: t.wx + 12,
            y: t.surfaceY - 10,
            w: TILE_W - 24,
            h: 10,
            type: "bounce",
            accent: "#5ef2b8"
          });
        }

        // Background Architectural Pillars & Monoliths (visual depth, non-solid)
        if (!t.gap && t.tx % 4 === 0 && hash(t.tx * 31.7 + 17) < 0.48) {
          const pillarH = 120 + Math.floor(hash(t.tx * 9.3) * 260);
          const pillarW = 24 + Math.floor(hash(t.tx * 4.7) * 40);
          decor.push({
            x: t.wx + (TILE_W - pillarW) * 0.5,
            y: t.surfaceY - pillarH,
            w: pillarW,
            h: pillarH,
            biome: t.biome.name
          });
        }
      }

      return { blocks, decor };
    }

    function getChunk(chunkIndex) {
      if (!chunks.has(chunkIndex)) {
        chunks.set(chunkIndex, generateChunk(chunkIndex));
      }
      return chunks.get(chunkIndex);
    }

    function getNearbySolids(minX, maxX) {
      const cStart = Math.floor(minX / CHUNK_W) - 1;
      const cEnd = Math.floor(maxX / CHUNK_W) + 1;
      const list = [];
      for (let c = cStart; c <= cEnd; c++) {
        const blocks = getChunk(c).blocks;
        for (let i = 0; i < blocks.length; i++) {
          list.push(blocks[i]);
        }
      }
      return list;
    }

    function rebuildWorld() {
      chunks.clear();
    }

    // Player State
    const player = {
      x: 0,
      y: getBaseGroundY() - cfg.size / 2,
      vx: 0,
      vy: 0,
      grounded: false,
      coyoteTimer: 0,
      jumpBufferTimer: 0,
      dropThroughTimer: 0,
      dashTimer: 0,
      dashFlash: 0,
      scaleX: 1,
      scaleY: 1,
      facing: 1,
      trail: []
    };

    const camera = {
      x: 0,
      y: getBaseGroundY() - height * 0.55
    };

    function respawnPlayer() {
      player.x = 0;
      player.y = getBaseGroundY() - cfg.size / 2 - 4;
      player.vx = 0;
      player.vy = 0;
      player.grounded = false;
      player.coyoteTimer = 0;
      player.jumpBufferTimer = 0;
      player.dropThroughTimer = 0;
      player.dashTimer = 0;
      player.dashFlash = 0;
      player.scaleX = 1;
      player.scaleY = 1;
      player.trail.length = 0;
      camera.x = player.x;
      camera.y = player.y - height * 0.1;
    }

    function newSeed() {
      cfg.seed = Math.floor(Math.random() * 999999) + 1;
      rebuildWorld();
      respawnPlayer();
    }

    // Input Handling
    const keys = new Set();

    window.addEventListener("keydown", (e) => {
      if (e.code === "Tab") {
        e.preventDefault();
        document.getElementById("panel").classList.toggle("open");
        return;
      }
      if (e.code === "KeyR") {
        respawnPlayer();
        return;
      }
      if (e.code === "KeyN") {
        newSeed();
        return;
      }
      if ((e.code === "Space" || e.code === "KeyW" || e.code === "ArrowUp") && !keys.has(e.code)) {
        player.jumpBufferTimer = 0.12;
      }
      if ((e.code === "KeyS" || e.code === "ArrowDown") && !keys.has(e.code)) {
        player.dropThroughTimer = 0.18;
      }
      if ((e.code === "ShiftLeft" || e.code === "ShiftRight") && !keys.has(e.code)) {
        triggerDash();
      }
      keys.add(e.code);
    });

    window.addEventListener("keyup", (e) => {
      if ((e.code === "Space" || e.code === "KeyW" || e.code === "ArrowUp") && player.vy < -180) {
        player.vy *= 0.55;
      }
      keys.delete(e.code);
    });

    window.addEventListener("blur", () => keys.clear());

    function getMoveX() {
      let ix = 0;
      if (keys.has("KeyA") || keys.has("ArrowLeft")) ix -= 1;
      if (keys.has("KeyD") || keys.has("ArrowRight")) ix += 1;
      if (ix !== 0) player.facing = ix;
      return ix;
    }

    function executeJump() {
      player.vy = -cfg.jumpForce;
      player.grounded = false;
      player.coyoteTimer = 0;
      player.jumpBufferTimer = 0;
      player.scaleX = 0.74;
      player.scaleY = 1.3;
    }

    function triggerDash() {
      if (player.dashTimer > 0) return;
      const ix = getMoveX();
      const dir = ix !== 0 ? ix : player.facing;

      player.vx = dir * cfg.dashSpeed;
      player.vy = Math.min(player.vy, 0) * 0.25;
      player.dashTimer = cfg.dashCooldown;
      player.dashFlash = 1;
      player.scaleX = 1.32;
      player.scaleY = 0.72;
    }

    // Tuner UI Bindings
    function bindSlider(id, valId, key, rebuild = false) {
      const el = document.getElementById(id);
      const out = document.getElementById(valId);
      el.addEventListener("input", () => {
        cfg[key] = Number(el.value);
        out.textContent = cfg[key];
        if (rebuild) rebuildWorld();
      });
    }

    bindSlider("s-rough", "v-rough", "roughness", true);
    bindSlider("s-plat", "v-plat", "platformDensity", true);
    bindSlider("s-gap", "v-gap", "gapChance", true);
    bindSlider("s-gravity", "v-gravity", "gravity");
    bindSlider("s-jump", "v-jump", "jumpForce", true);
    bindSlider("s-speed", "v-speed", "maxSpeed", true);
    bindSlider("s-dash", "v-dash", "dashSpeed");

    const btnGrid = document.getElementById("btn-grid");
    btnGrid.addEventListener("click", () => {
      cfg.showGrid = !cfg.showGrid;
      btnGrid.textContent = `Grid: ${cfg.showGrid ? "ON" : "OFF"}`;
    });

    document.getElementById("btn-seed").addEventListener("click", newSeed);

    // Axis-Aligned Bounding Box Collision Resolution
    function aabbOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
      return ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;
    }

    let lastTime = performance.now();

    function update(dt) {
      if (player.dashTimer > 0) player.dashTimer = Math.max(0, player.dashTimer - dt);
      if (player.dashFlash > 0) player.dashFlash = Math.max(0, player.dashFlash - dt * 4);
      if (player.coyoteTimer > 0) player.coyoteTimer = Math.max(0, player.coyoteTimer - dt);
      if (player.jumpBufferTimer > 0) player.jumpBufferTimer = Math.max(0, player.jumpBufferTimer - dt);
      if (player.dropThroughTimer > 0) player.dropThroughTimer = Math.max(0, player.dropThroughTimer - dt);

      const ix = getMoveX();
      const controlMult = player.grounded ? 1 : cfg.airControl;

      // Horizontal acceleration & friction
      if (ix !== 0) {
        player.vx += ix * cfg.accel * controlMult * dt;
        if (Math.abs(player.vx) > cfg.maxSpeed) {
          const sign = Math.sign(player.vx);
          const nextSpeed = Math.max(cfg.maxSpeed, Math.abs(player.vx) - cfg.friction * 1.4 * dt);
          player.vx = sign * nextSpeed;
        }
      } else {
        const drag = player.grounded ? cfg.friction : cfg.friction * 0.35;
        const speed = Math.abs(player.vx);
        if (speed > 0) {
          const nextSpeed = Math.max(0, speed - drag * dt);
          player.vx = Math.sign(player.vx) * nextSpeed;
        }
      }

      if (player.jumpBufferTimer > 0 && (player.grounded || player.coyoteTimer > 0)) {
        executeJump();
      }

      // Gravity
      player.vy += cfg.gravity * dt;

      const half = cfg.size / 2;
      const solids = getNearbySolids(player.x - 240, player.x + 240);

      // Step X & resolve horizontal collisions (skip one-way platforms)
      player.x += player.vx * dt;
      for (let i = 0; i < solids.length; i++) {
        const s = solids[i];
        if (s.oneWay || s.type === "bounce") continue;
        if (aabbOverlap(player.x - half, player.y - half, cfg.size, cfg.size, s.x, s.y, s.w, s.h)) {
          if (player.vx > 0) {
            player.x = s.x - half;
            player.vx = 0;
          } else if (player.vx < 0) {
            player.x = s.x + s.w + half;
            player.vx = 0;
          }
        }
      }

      // Step Y & resolve vertical collisions
      const prevBottom = player.y + half;
      const wasGrounded = player.grounded;
      player.grounded = false;
      player.y += player.vy * dt;

      for (let i = 0; i < solids.length; i++) {
        const s = solids[i];
        if (!aabbOverlap(player.x - half, player.y - half, cfg.size, cfg.size, s.x, s.y, s.w, s.h)) {
          continue;
        }

        // Bounce pad impulse
        if (s.type === "bounce" && player.vy >= 0) {
          player.y = s.y - half;
          player.vy = -cfg.jumpForce * 1.48;
          player.grounded = false;
          player.coyoteTimer = 0;
          player.scaleX = 0.65;
          player.scaleY = 1.42;
          player.dashFlash = 0.7;
          continue;
        }

        // One-way platform (passable from below or when pressing Down/S)
        if (s.oneWay) {
          if (player.dropThroughTimer > 0) continue;
          if (player.vy > 0 && prevBottom <= s.y + 8) {
            if (!wasGrounded && player.vy > 140) {
              const impact = Math.min(player.vy / 1200, 1);
              player.scaleX = 1 + 0.32 * impact;
              player.scaleY = 1 - 0.26 * impact;
            }
            player.y = s.y - half;
            player.vy = 0;
            player.grounded = true;
            player.coyoteTimer = 0.1;
          }
          continue;
        }

        // Full solid ground
        if (player.vy > 0) {
          if (!wasGrounded && player.vy > 140) {
            const impact = Math.min(player.vy / 1200, 1);
            player.scaleX = 1 + 0.32 * impact;
            player.scaleY = 1 - 0.26 * impact;
          }
          player.y = s.y - half;
          player.vy = 0;
          player.grounded = true;
          player.coyoteTimer = 0.1;
        } else if (player.vy < 0) {
          player.y = s.y + s.h + half;
          player.vy = 0;
        }
      }

      if (wasGrounded && !player.grounded && player.vy >= 0) {
        player.coyoteTimer = 0.1;
      }

      // Respawn if fallen into a chasm
      if (player.y > getBaseGroundY() + 900) {
        respawnPlayer();
        return;
      }

      // Smooth camera tracking
      const camLerp = 1 - Math.exp(-9 * dt);
      const lookAheadX = player.vx * 0.22;
      camera.x += (player.x + lookAheadX - camera.x) * camLerp;
      camera.y += (player.y - height * 0.08 - camera.y) * (1 - Math.exp(-6 * dt));

      // Recover squash/stretch
      const spring = 1 - Math.exp(-18 * dt);
      player.scaleX += (1 - player.scaleX) * spring;
      player.scaleY += (1 - player.scaleY) * spring;

      // Trail recording
      const currentSpeed = Math.hypot(player.vx, player.vy);
      if (currentSpeed > 60) {
        player.trail.push({ x: player.x, y: player.y, alpha: 0.24 });
        if (player.trail.length > 14) player.trail.shift();
      }
      for (let i = player.trail.length - 1; i >= 0; i--) {
        player.trail[i].alpha -= dt * 1.4;
        if (player.trail[i].alpha <= 0) player.trail.splice(i, 1);
      }

      const currentTile = Math.round(player.x / TILE_W);
      const curBiome = getBiomeAtTile(currentTile);
      coordsEl.textContent = `X: ${currentTile}m  |  Biome: ${curBiome.name}  |  Seed: ${cfg.seed}`;
    }

    function draw() {
      ctx.fillStyle = "#0d0f12";
      ctx.fillRect(0, 0, width, height);

      const camLeft = camera.x - width / 2;
      const camTop = camera.y - height / 2;

      // Parallax Grid
      if (cfg.showGrid) {
        const step = 64;
        const startX = -((camLeft % step) + step) % step;
        const startY = -((camTop % step) + step) % step;

        ctx.strokeStyle = "rgba(255, 255, 255, 0.032)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let x = startX; x <= width; x += step) {
          ctx.moveTo(x, 0);
          ctx.lineTo(x, height);
        }
        for (let y = startY; y <= height; y += step) {
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
        }
        ctx.stroke();
      }

      // Subtle Parallax Distant Skyline Layer
      ctx.save();
      ctx.translate(-camLeft * 0.35, -camTop * 0.2);
      const bgStart = Math.floor((camLeft * 0.35 - 200) / 180);
      const bgEnd = Math.floor((camLeft * 0.35 + width + 200) / 180);
      for (let i = bgStart; i <= bgEnd; i++) {
        const h = 90 + hash(i * 17.3 + 5) * 240;
        const w = 48 + hash(i * 9.1 + 2) * 70;
        const x = i * 180;
        const y = getBaseGroundY() - h + 40;
        ctx.fillStyle = "rgba(255, 255, 255, 0.018)";
        ctx.fillRect(x, y, w, h + 600);
      }
      ctx.restore();

      ctx.save();
      ctx.translate(-camLeft, -camTop);

      const cStart = Math.floor((camLeft - 160) / CHUNK_W) - 1;
      const cEnd = Math.floor((camLeft + width + 160) / CHUNK_W) + 1;

      // Background Architectural Pillars
      for (let c = cStart; c <= cEnd; c++) {
        const { decor } = getChunk(c);
        for (let i = 0; i < decor.length; i++) {
          const d = decor[i];
          ctx.fillStyle = "rgba(255, 255, 255, 0.025)";
          ctx.fillRect(d.x, d.y, d.w, d.h);
          ctx.strokeStyle = "rgba(255, 255, 255, 0.045)";
          ctx.lineWidth = 1;
          ctx.strokeRect(d.x, d.y, d.w, d.h);
        }
      }

      // Render Visible World Chunks
      for (let c = cStart; c <= cEnd; c++) {
        const { blocks } = getChunk(c);
        for (let i = 0; i < blocks.length; i++) {
          const b = blocks[i];
          if (b.type === "ground") {
            ctx.fillStyle = b.fill || "#161a20";
            ctx.fillRect(b.x, b.y, b.w + 0.5, b.h);

            // Subtle vertical strata lines inside wide merged ground blocks
            ctx.fillStyle = "rgba(255, 255, 255, 0.018)";
            for (let gx = b.x + TILE_W; gx < b.x + b.w; gx += TILE_W) {
              ctx.fillRect(gx, b.y + 4, 1, 180);
            }

            // Biome-tinted surface trim
            ctx.fillStyle = b.accent || "rgba(255, 255, 255, 0.24)";
            ctx.fillRect(b.x, b.y, b.w + 0.5, 2.5);
          } else if (b.type === "bounce") {
            ctx.fillStyle = "rgba(94, 242, 184, 0.24)";
            ctx.fillRect(b.x, b.y, b.w, b.h);
            ctx.fillStyle = "#5ef2b8";
            ctx.fillRect(b.x, b.y, b.w, 3);
          } else {
            ctx.fillStyle = "#1c2129";
            ctx.fillRect(b.x, b.y, b.w, b.h);

            // Top lip highlights one-way pass-through platforms
            ctx.fillStyle = b.accent || "rgba(255, 255, 255, 0.28)";
            ctx.fillRect(b.x, b.y, b.w, 2);

            ctx.strokeStyle = "rgba(255, 255, 255, 0.14)";
            ctx.lineWidth = 1;
            ctx.strokeRect(b.x, b.y, b.w, b.h);
          }
        }
      }

      // Motion Trail
      for (let i = 0; i < player.trail.length; i++) {
        const t = player.trail[i];
        const ratio = (i + 1) / player.trail.length;
        const s = cfg.size * (0.65 + 0.35 * ratio);
        ctx.fillStyle = `rgba(255, 255, 255, ${t.alpha * 0.42})`;
        ctx.fillRect(t.x - s / 2, t.y - s / 2, s, s);
      }

      // The Square
      ctx.save();
      ctx.translate(player.x, player.y + cfg.size / 2);
      ctx.scale(player.scaleX, player.scaleY);

      if (player.dashFlash > 0) {
        ctx.shadowColor = "rgba(255, 255, 255, 0.65)";
        ctx.shadowBlur = 18 * player.dashFlash;
      }

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(-cfg.size / 2, -cfg.size, cfg.size, cfg.size);
      ctx.restore();

      ctx.restore();
    }

    function loop(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    respawnPlayer();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
