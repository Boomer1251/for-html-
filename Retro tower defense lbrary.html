<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TD Stats Library</title>
<style>
:root{--bg:#121212;--panel:#1e1e1e;--line:#333;--hi:#55ff55;--mut:#aaa;--gold:#ffcc44;--bad:#ff6666;--btn:#2a2a2a;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:#fff;font-family:monospace;padding:20px;margin:0}
.ic{width:1.1em;height:1.1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;margin-right:4px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap;align-items:center}
.tab{background:none;border:1px solid transparent;border-bottom:none;color:var(--mut);padding:9px 16px;font:bold 13px monospace;cursor:pointer;width:auto;margin:0}
.tab:hover{color:#fff}
.tab.active{background:var(--panel);color:var(--hi);border-color:var(--line)}
.page{display:none}.page.active{display:block}
.grid{display:flex;flex-wrap:wrap;gap:15px;align-items:flex-start}
.card{background:var(--panel);border:1px solid var(--line);padding:12px;width:400px;max-width:100%;box-sizing:border-box}
.title{font-weight:bold;font-size:16px;margin-bottom:8px;border-bottom:1px solid var(--line);padding-bottom:4px;display:flex;justify-content:space-between;align-items:center}
select,input,button{background:var(--btn);color:#fff;border:1px solid #444;padding:6px;font-family:monospace;width:100%;margin-bottom:8px;box-sizing:border-box}
select:focus,input:focus{outline:none;border-color:var(--hi)}
button{cursor:pointer;background:#333;font-weight:bold}button:hover{background:#444}
table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:10px}
td,th{border:1px solid var(--line);padding:4px 6px;text-align:left}th{background:#252525}
tbody tr:hover{background:#242424}
.summary{font-size:13px;line-height:1.6;border-top:1px dashed #444;padding-top:8px}
.highlight{color:var(--hi);font-weight:bold}
.bad{color:var(--bad)}
.trait-desc{color:var(--mut);font-size:11px;margin-bottom:8px;min-height:28px;background:#181818;padding:5px 7px;border:1px solid #2b2b2b}
.rating{color:var(--gold);font-size:12px;margin-left:6px}
label{font-size:11px;color:var(--mut);display:block;margin-bottom:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}.row>div{flex:1;min-width:150px}
.scroll{overflow-x:auto}
.comp-table th,.comp-table td{font-size:11px;padding:6px;white-space:nowrap}
.comp-table th{cursor:pointer;user-select:none;position:sticky;top:0}.comp-table th:hover{background:#333}
.comp-table tr.active-row{background:#1b2b1b}
.best-cell{background:#1b2e1b;color:var(--hi);font-weight:bold}
.sort-arrow{font-size:10px;margin-left:3px;color:#666}.sort-arrow.active{color:var(--hi)}
.chip{display:inline-block;background:#2a2a2a;border:1px solid #444;border-radius:10px;padding:1px 7px;margin:1px;font-size:10px;color:var(--mut)}
.pill{color:var(--gold)}
.sub-odds{color:#777;font-size:10px;margin-left:4px}
.delta{font-size:10px;margin-left:4px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;background:var(--panel);border:1px solid var(--line);padding:10px}
.toolbar>div{flex:1;min-width:160px}
.toolbar input,.toolbar select,.toolbar button{margin-bottom:0}
.check-wrap{display:flex;align-items:center;gap:6px;font-size:12px;color:#ccc;cursor:pointer;user-select:none;height:31px}
.check-wrap input{width:auto;margin:0;accent-color:var(--hi)}
.empty{color:var(--mut);padding:20px;text-align:center;border:1px dashed var(--line)}
#hoverTrait{position:fixed;pointer-events:none;z-index:9999;display:none;background:var(--panel);color:var(--hi);border:1px solid var(--hi);padding:2px 7px;font:bold 11px monospace;white-space:nowrap}
</style>
</head>
<body>

<div id="hoverTrait"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-tower" viewBox="0 0 24 24"><path d="M5 21V9l3-2V4h2v2h4V4h2v3l3 2v12M3 21h18M10 21v-5a2 2 0 0 1 4 0v5"/></symbol>

</svg>

<div class="tabs">
  <button class="tab active" data-tab="towers" onclick="showTab('towers')"><svg class="ic"><use href="#i-tower"/></svg>Towers</button>
  <button class="tab" data-tab="traits" onclick="showTab('traits')"><svg class="ic"><use href="#i-spark"/></svg>Traits</button>
  <button class="tab" data-tab="compare" onclick="showTab('compare')"><svg class="ic"><use href="#i-bars"/></svg>Compare</button>
</div>

<!-- TOWERS -->
<div class="page active" id="page-towers">
  <div class="toolbar">
    <div><label>Filter Towers</label><input id="twSearch" placeholder="Search tower name..." oninput="filterCards()"></div>
    <div><label>Global Trait Preview</label><select id="globalTraitSelect" onchange="applyGlobalTrait(this.value)"></select></div>
    <div style="flex:0 0 auto;min-width:120px"><label>&nbsp;</label><button onclick="resetAllTraits()">Reset Traits</button></div>
  </div>
  <div class="grid" id="cardGrid"></div>
</div>

<!-- TRAITS -->
<div class="page" id="page-traits">
  <div class="row">
    <div><label>Search</label><input id="trSearch" placeholder="Name or effect..." oninput="renderTraits()"></div>
    <div><label>Category</label>
      <select id="trCat" onchange="renderTraits()">
        <option value="all">All Categories</option>
        <option value="econ">Economy / Cost / Limit</option>
        <option value="offense">Damage / Range / Blast</option>
        <option value="speed">Cooldown / Speed</option>
        <option value="unique">Tower-Specific</option>
      </select>
    </div>
    <div><label>Tower</label><select id="trTower" onchange="renderTraits()"></select></div>
  </div>
  <div class="scroll" id="traitList"></div>
</div>

<!-- COMPARE -->
<div class="page" id="page-compare">
  <div class="row">
    <div><label>Tower</label><select id="compTower" onchange="populateCompare()"></select></div>
    <div><label>Mode</label>
      <select id="compMode" onchange="renderComparison()">
        <option value="all">Compare All Allowed Traits</option>
        <option value="two">Compare 2 Traits</option>
      </select>
    </div>
    <div id="trait1Group" style="display:none"><label>Trait 1</label><select id="compTrait1" onchange="renderComparison()"></select></div>
    <div id="trait2Group" style="display:none"><label>Trait 2</label><select id="compTrait2" onchange="renderComparison()"></select></div>
    <div style="flex:0 0 auto;min-width:160px"><label>&nbsp;</label>
      <label class="check-wrap"><input type="checkbox" id="hiBest" checked onchange="renderComparison()">Highlight Best</label>
    </div>
  </div>
  <div class="scroll" id="compareResults"></div>
</div>

  if (t.cd === undefined) t.cd = 1;

const compareColumns = {
  income: [
    ["traitName","Trait",d=>`<b>${d.traitName}</b>`,null],
    ["numChance","Chance",d=>d.chance,null],

let currentTowerName = "Tycoon", sortKey = null, sortAsc = true;
const fmt = n => parseFloat(n.toFixed(2)).toLocaleString();
const slug = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');
const oneIn = ch => {
  const p = parseFloat(ch);
  return isNaN(p) || p <= 0 ? '' : `<span class="sub-odds">(1 in ${Math.round(100/p).toLocaleString()})</span>`;
};

/* ---------- CURSOR TRAIT TAG ---------- */
const hoverBadge = document.getElementById('hoverTrait');
function moveHoverBadge(e) {
  const offset = 10;
  const rect = hoverBadge.getBoundingClientRect();
  let x = e.clientX + offset;
  let y = e.clientY - rect.height - offset;
  if (x + rect.width > window.innerWidth - 6) x = e.clientX - rect.width - offset;
  if (y < 6) y = e.clientY + offset;
  hoverBadge.style.left = `${x}px`;
  hoverBadge.style.top = `${y}px`;
}
function hideHoverBadge() {
  hoverBadge.style.display = 'none';
  hoverBadge.textContent = '';
}
document.addEventListener('mousemove', (e) => {
  if (hoverBadge.style.display === 'block') moveHoverBadge(e);
});
window.addEventListener('scroll', hideHoverBadge, true);

function saveState() {
  try {
    const selected = {};
    for (const n in baseTowers) {
      const el = document.getElementById(`${slug(n)}-trait`);
      if (el) selected[n] = el.value;
    }
    localStorage.setItem('td_lib_state', JSON.stringify({
      tab: document.querySelector('.tab.active')?.dataset.tab || 'towers',
      selected,
      compTower: document.getElementById('compTower')?.value
    }));
  } catch (e) {}
}

function loadState() {
  try { return JSON.parse(localStorage.getItem('td_lib_state') || '{}'); }
  catch (e) { return {}; }
}

function getTraitsForTower(towerName) {
  const out = {};
  for (const n in globalTraits) {
    const tr = globalTraits[n];
    if (tr.excluded && tr.excluded.includes(towerName)) continue;
    if (tr.towers === "All" || tr.towers === "All_Except_Support" ||
        (Array.isArray(tr.towers) && tr.towers.includes(towerName))) out[n] = tr;
  }
  return out;
}

/* ---------- TABS ---------- */
function showTab(id) {
  hideHoverBadge();
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + id));
  saveState();
}

/* ---------- TOWERS TAB ---------- */
function buildCards() {
  const saved = loadState().selected || {};
  const gSel = document.getElementById('globalTraitSelect');
  gSel.add(new Option('-- Per-Tower Trait --', ''));
  for (const t in globalTraits) {
    if (globalTraits[t].towers === "All" || globalTraits[t].towers === "All_Except_Support") {
      gSel.add(new Option(`${t} (${globalTraits[t].chance})`, t));
    }
  }

  const grid = document.getElementById('cardGrid');
  grid.innerHTML = '';
  for (const name in baseTowers) {
    const tower = baseTowers[name], id = slug(name);
    const headers = tower.type === "income"
      ? `<th>Lvl</th><th>${ic('coin')}Price</th><th>Bonus/Wave</th><th>Payback</th>`
      : `<th>Lvl</th><th>${ic('car')}Unit</th><th>${ic('coin')}Price</th><th>${ic('bolt')}Ram DPS</th><th>${ic('clock')}CD</th><th>${ic('heart')}HP</th><th>${ic('gauge')}Spd</th>`;
    const ratingHtml = tower.rating ? `<span class="rating">[${tower.rating}]</span>` : '';
    const extra = tower.type === "vehicle"
      ? `<br>${ic('blast')}<span style="color:#aaa">Lv4 Cannon:</span> <span id="${id}-cannon"></span>` : '';
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.name = name.toLowerCase();
    card.innerHTML = `
      <div class="title"><span>${ic(towerIcon[tower.type])}${name}${ratingHtml}</span><span id="${id}-limit"></span></div>
      <label>Select Trait:</label>
      <select id="${id}-trait" onchange="updateCard('${name}');saveState()"></select>
      <button onclick="openCompare('${name}')">${ic('bars')}Compare All Traits</button>
      <div class="trait-desc" id="${id}-desc"></div>
      <div class="scroll"><table><thead><tr>${headers}</tr></thead><tbody id="${id}-table"></tbody></table></div>
      <div class="summary">
        ${ic('coin')}Max 1 Unit: <span class="highlight" id="${id}-cost-1"></span><br>
        ${ic('box')}Max All (<span id="${id}-count"></span>): <span class="highlight" id="${id}-cost-max"></span>
        ${extra}
      </div>`;
    grid.appendChild(card);
    const select = document.getElementById(`${id}-trait`);
    const traits = getTraitsForTower(name);
    for (const t in traits) select.add(new Option(`${t} (${traits[t].chance})`, t));
    if (saved[name] && traits[saved[name]]) select.value = saved[name];
    updateCard(name);
  }
}

function applyGlobalTrait(traitName) {
  if (!traitName) return;
  for (const name in baseTowers) {
    const sel = document.getElementById(`${slug(name)}-trait`);
    if ([...sel.options].some(o => o.value === traitName)) {
      sel.value = traitName;
      updateCard(name);
    }
  }
  saveState();
}

function resetAllTraits() {
  document.getElementById('globalTraitSelect').value = '';
  for (const name in baseTowers) {
    document.getElementById(`${slug(name)}-trait`).value = 'None';
    updateCard(name);
  }
  saveState();
}

function filterCards() {
  const q = document.getElementById('twSearch').value.toLowerCase().trim();
  document.querySelectorAll('#cardGrid .card').forEach(c => {
    c.style.display = !q || c.dataset.name.includes(q) ? 'block' : 'none';
  });
}

function updateCard(name) {
  const tower = baseTowers[name], id = slug(name);
  const traits = getTraitsForTower(name);
  const trait = traits[document.getElementById(`${id}-trait`).value] || globalTraits["None"];
  document.getElementById(`${id}-desc`).innerHTML = `<b>Chance:</b> <span class="pill">${trait.chance}</span> ${oneIn(trait.chance)}<br>${trait.desc}`;

  const limit = tower.baseLimit + trait.limitAdd;
  document.getElementById(`${id}-limit`).textContent = `Max: ${limit}`;
  document.getElementById(`${id}-count`).textContent = limit;

  let rows = '', total = 0;
  tower.levels.forEach((lvl, i) => {
    const price = Math.round(lvl.price * trait.costMult);
    total += price;
    if (tower.type === "income") {
      const bonus = Math.round(lvl.bonus * trait.incomeMult);
      const pb = bonus > 0 ? (total / bonus).toFixed(1) + 'w' : 'N/A';
      rows += `<tr><td>${i+1}</td><td>$${price.toLocaleString()}</td><td class="highlight">+$${bonus.toLocaleString()}</td><td>${pb}</td></tr>`;
    } else {
      rows += `<tr><td>${i+1}</td><td>${lvl.vehicle}</td><td>$${price.toLocaleString()}</td><td>${fmt(lvl.dps*trait.dmg)}</td><td>${fmt(lvl.cd*trait.cd)}s</td><td>${lvl.hp}</td><td>${lvl.speed}</td></tr>`;
    }
  });
  document.getElementById(`${id}-table`).innerHTML = rows;
  document.getElementById(`${id}-cost-1`).textContent = `$${total.toLocaleString()}`;
  document.getElementById(`${id}-cost-max`).textContent = `$${(total * limit).toLocaleString()}`;

  if (tower.type === "vehicle") {
    const c = tower.cannon;
    const cDmg = c.damage * trait.dmg, cCd = c.cooldown * trait.cd;
    document.getElementById(`${id}-cannon`).textContent =
      `${fmt(cDmg)} dmg (${fmt(cDmg/cCd)} DPS), ${fmt(cCd)}s CD, ${fmt(c.range*trait.range)}m rng, ${fmt(c.explosion*trait.blast)}m blast`;
  }
}

/* ---------- TRAITS TAB ---------- */
function initTraitsTab() {
  const sel = document.getElementById('trTower');
  sel.add(new Option('All towers', ''));
  for (const n in baseTowers) sel.add(new Option(n, n));
  renderTraits();
}

function renderTraits() {
  const q = document.getElementById('trSearch').value.toLowerCase().trim();
  const tw = document.getElementById('trTower').value;
  const cat = document.getElementById('trCat').value;
  const list = tw ? getTraitsForTower(tw) : globalTraits;
  let count = 0;
  let html = `<table><thead><tr><th>${ic('spark')}Trait</th><th>${ic('dice')}Chance</th><th>Effect</th><th>${ic('tower')}Allowed Towers</th></tr></thead><tbody>`;
  for (const n in list) {
    if (n === "None") continue;
    const t = list[n];
    if (cat !== "all" && t.cat !== cat) continue;
    if (q && !(n + ' ' + t.desc).toLowerCase().includes(q)) continue;
    count++;
    const tw2 = Array.isArray(t.towers) ? t.towers.map(x => `<span class="chip">${x}</span>`).join('')
      : `<span class="chip">${t.towers === "All" ? "All towers" : "All except support"}</span>`;
    html += `<tr><td><b>${n}</b></td><td class="pill">${t.chance}${oneIn(t.chance)}</td><td>${t.desc}</td><td>${tw2}</td></tr>`;
  }
  document.getElementById('traitList').innerHTML = count
    ? html + '</tbody></table>'
    : `<div class="empty">No traits match your current filters.</div>`;
}

/* ---------- COMPARE TAB ---------- */
function initCompareTab() {
  const sel = document.getElementById('compTower');
  for (const n in baseTowers) sel.add(new Option(n, n));
  const savedTower = loadState().compTower;
  if (savedTower && baseTowers[savedTower]) sel.value = savedTower;
  populateCompare();
}

function openCompare(name) {
  document.getElementById('compTower').value = name;
  populateCompare();
  const activeTrait = document.getElementById(`${slug(name)}-trait`)?.value;
  if (activeTrait && activeTrait !== 'None') {
    document.getElementById('compTrait1').value = activeTrait;
  }
  showTab('compare');
}

function populateCompare() {
  currentTowerName = document.getElementById('compTower').value;
  sortKey = null; sortAsc = true;
  const traits = getTraitsForTower(currentTowerName), keys = Object.keys(traits);
  ['compTrait1', 'compTrait2'].forEach(id => {
    const s = document.getElementById(id);
    s.innerHTML = '';
    keys.forEach(t => s.add(new Option(`${t} (${traits[t].chance})`, t)));
  });
  const defs = baseTowers[currentTowerName].defaultCompare || [];
  if (keys.includes(defs[0])) document.getElementById('compTrait1').value = defs[0];
  if (keys.includes(defs[1])) document.getElementById('compTrait2').value = defs[1];
  saveState();
  renderComparison();
}

function toggleSort(key) {
  if (sortKey === key) sortAsc = !sortAsc; else { sortKey = key; sortAsc = true; }
  renderComparison();
}

function getTowerTraitMetrics(towerName, traitKey) {
  const tower = baseTowers[towerName], trait = globalTraits[traitKey];
  const limit = tower.baseLimit + trait.limitAdd;
  let totalCostOne = 0;
  tower.levels.forEach(l => totalCostOne += Math.round(l.price * trait.costMult));
  const totalCostAll = totalCostOne * limit;
  let numChance = parseFloat(trait.chance.replace('%', ''));
  if (isNaN(numChance)) numChance = -1;
  const base = { traitName: traitKey, chance: trait.chance, numChance, limit, totalCostOne, totalCostAll };
  const last = tower.levels[tower.levels.length - 1];

  if (tower.type === "income") {
    const b = Math.round(last.bonus * trait.incomeMult);
    const maxLevelBonusAll = b * limit;
    return {
      ...base,
      maxLevelBonusOne: b,
      maxLevelBonusAll,
      incomePer1k: totalCostOne > 0 ? (b / totalCostOne) * 1000 : 0,
      paybackCyclesOne: b > 0 ? totalCostOne / b : 999999
    };
  }
  const c = tower.cannon;
  const cannonDamage = c.damage * trait.dmg, cannonCd = c.cooldown * trait.cd;
  const cannonDpsOne = cannonDamage / cannonCd, ramDpsOne = last.dps * trait.dmg;
  const totalDpsAll = (ramDpsOne + cannonDpsOne) * limit;
  return {
    ...base,
    ramDpsOne,
    spawnCd: last.cd * trait.cd,
    cannonDpsOne,
    totalDpsAll,
    dpsPer1k: totalCostAll > 0 ? (totalDpsAll / totalCostAll) * 1000 : 0,
    cannonRange: c.range * trait.range,
    cannonBlast: c.explosion * trait.blast
  };
}

function renderComparison() {
  hideHoverBadge();
  const two = document.getElementById('compMode').value === 'two';
  const hiBest = document.getElementById('hiBest').checked;
  document.getElementById('trait1Group').style.display = two ? 'block' : 'none';
  document.getElementById('trait2Group').style.display = two ? 'block' : 'none';

  const cols = compareColumns[baseTowers[currentTowerName].type];
  const activeCardTrait = document.getElementById(`${slug(currentTowerName)}-trait`)?.value;
  const traitList = two
    ? [document.getElementById('compTrait1').value, document.getElementById('compTrait2').value]
    : Object.keys(getTraitsForTower(currentTowerName));

  const data = traitList.map(k => getTowerTraitMetrics(currentTowerName, k));
  const baseline = getTowerTraitMetrics(currentTowerName, "None");

  const bestVals = {};
  if (hiBest && data.length > 1) {
    cols.forEach(([k, , , dir]) => {
      if (!dir) return;
      const vals = data.map(d => d[k]).filter(v => typeof v === 'number' && v !== 999999);
      if (vals.length) bestVals[k] = dir === 'max' ? Math.max(...vals) : Math.min(...vals);
    });
  }

  if (sortKey) data.sort((a, b) => typeof a[sortKey] === 'string'
    ? (sortAsc ? a[sortKey].localeCompare(b[sortKey]) : b[sortKey].localeCompare(a[sortKey]))
    : (sortAsc ? a[sortKey] - b[sortKey] : b[sortKey] - a[sortKey]));

  const arrow = k => sortKey !== k ? '<span class="sort-arrow">▲▼</span>'
    : `<span class="sort-arrow active">${sortAsc ? '▲' : '▼'}</span>`;

  let html = '<table class="comp-table"><thead><tr>' +
    cols.map(([k, label]) => `<th onclick="toggleSort('${k}')">${label} ${arrow(k)}</th>`).join('') + '</tr></thead><tbody>';

  data.forEach(d => {
    const isCurrent = d.traitName === activeCardTrait;
    const safeTrait = d.traitName.replace(/"/g, '&quot;');
    html += `<tr class="${isCurrent ? 'active-row' : ''}" data-trait="${safeTrait}">` + cols.map(([k, , fn, dir]) => {
      const isBest = hiBest && dir && bestVals[k] !== undefined && d[k] === bestVals[k] && d[k] !== baseline[k];
      let deltaHtml = '';
      if (two && dir && d.traitName !== 'None' && typeof d[k] === 'number' && baseline[k] > 0 && d[k] !== 999999) {
        const diff = ((d[k] - baseline[k]) / baseline[k]) * 100;
        if (Math.abs(diff) >= 0.1) {
          const good = (dir === 'max' && diff > 0) || (dir === 'min' && diff < 0);
          deltaHtml = `<span class="delta ${good ? 'highlight' : 'bad'}">(${diff > 0 ? '+' : ''}${diff.toFixed(0)}%)</span>`;
        }
      }
      return `<td class="${isBest ? 'best-cell' : ''}">${fn(d)}${deltaHtml}</td>`;
    }).join('') + '</tr>';
  });

  const container = document.getElementById('compareResults');
  container.innerHTML = html + '</tbody></table>';

  const tbody = container.querySelector('tbody');
  if (tbody) {
    tbody.addEventListener('mouseover', (e) => {
      const cell = e.target.closest('td, th');
      const row = e.target.closest('tr[data-trait]');
      if (!cell || !row) return;
      hoverBadge.textContent = row.dataset.trait;
      hoverBadge.style.display = 'block';
      moveHoverBadge(e);
    });
    tbody.addEventListener('mouseleave', hideHoverBadge);
  }
}

buildCards();
initTraitsTab();
initCompareTab();
const savedTab = loadState().tab;
if (savedTab && document.getElementById('page-' + savedTab)) showTab(savedTab);
</script>
</body>
