<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TD Stats Library</title>
<style>
:root{--bg:#121212;--panel:#1e1e1e;--line:#333;--hi:#55ff55;--mut:#aaa;--gold:#ffcc44;--btn:#2a2a2a;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:#fff;font-family:monospace;padding:20px;margin:0}
.ic{width:1.1em;height:1.1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;margin-right:4px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tab{background:none;border:1px solid transparent;border-bottom:none;color:var(--mut);padding:9px 16px;font:bold 13px monospace;cursor:pointer;width:auto;margin:0}
.tab:hover{color:#fff}
.tab.active{background:var(--panel);color:var(--hi);border-color:var(--line)}
.page{display:none}.page.active{display:block}
.grid{display:flex;flex-wrap:wrap;gap:15px;align-items:flex-start}
.card{background:var(--panel);border:1px solid var(--line);padding:12px;width:380px;max-width:100%;box-sizing:border-box}
.title{font-weight:bold;font-size:16px;margin-bottom:8px;border-bottom:1px solid var(--line);padding-bottom:4px;display:flex;justify-content:space-between}
select,input,button{background:var(--btn);color:#fff;border:1px solid #444;padding:6px;font-family:monospace;width:100%;margin-bottom:8px;box-sizing:border-box}
button{cursor:pointer;background:#333;font-weight:bold}button:hover{background:#444}
table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:10px}
td,th{border:1px solid var(--line);padding:4px;text-align:left}th{background:#252525}
.summary{font-size:13px;line-height:1.5;border-top:1px dashed #444;padding-top:8px}
.highlight{color:var(--hi)}.trait-desc{color:var(--mut);font-size:11px;margin-bottom:8px;min-height:26px}
.rating{color:var(--gold);font-size:12px;margin-left:6px}
label{font-size:11px;color:var(--mut)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>div{flex:1;min-width:150px}
.scroll{overflow-x:auto}
.comp-table th,.comp-table td{font-size:11px;padding:6px;white-space:nowrap}
.comp-table th{cursor:pointer;user-select:none}.comp-table th:hover{background:#333}
.sort-arrow{font-size:10px;margin-left:3px;color:#666}.sort-arrow.active{color:var(--hi)}
.chip{display:inline-block;background:#2a2a2a;border:1px solid #444;border-radius:10px;padding:1px 7px;margin:1px;font-size:10px;color:var(--mut)}
.pill{color:var(--gold)}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-tower" viewBox="0 0 24 24"><path d="M5 21V9l3-2V4h2v2h4V4h2v3l3 2v12M3 21h18M10 21v-5a2 2 0 0 1 4 0v5"/></symbol>
<symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></symbol>
<symbol id="i-bars" viewBox="0 0 24 24"><path d="M5 20V11M11 20V4M17 20v-6M2 20h20"/></symbol>
<symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M14.5 9c-.5-1-1.5-1.5-2.5-1.5-1.5 0-2.5.7-2.5 1.8s1 1.5 2.5 1.7 2.5.6 2.5 1.8-1 1.8-2.5 1.8c-1 0-2-.5-2.5-1.5M12 5.5V7M12 17v1.5"/></symbol>
<symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></symbol>
<symbol id="i-gauge" viewBox="0 0 24 24"><path d="M4 17a8 8 0 1 1 16 0M12 17l4-5"/></symbol>
<symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".5"/></symbol>
<symbol id="i-blast" viewBox="0 0 24 24"><path d="M12 2l2 5 5-2-2 5 5 2-5 2 2 5-5-2-2 5-2-5-5 2 2-5-5-2 5-2-2-5 5 2z"/></symbol>
<symbol id="i-car" viewBox="0 0 24 24"><path d="M3 16v-3l2-5h14l2 5v3zM3 16v3h3v-3M18 16v3h3v-3M7 12h10"/></symbol>
<symbol id="i-dice" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r=".8"/><circle cx="15" cy="15" r=".8"/><circle cx="12" cy="12" r=".8"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
<symbol id="i-box" viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10"/></symbol>
</svg>

<div class="tabs">
  <button class="tab active" data-tab="towers" onclick="showTab('towers')"><svg class="ic"><use href="#i-tower"/></svg>Towers</button>
  <button class="tab" data-tab="traits" onclick="showTab('traits')"><svg class="ic"><use href="#i-spark"/></svg>Traits</button>
  <button class="tab" data-tab="compare" onclick="showTab('compare')"><svg class="ic"><use href="#i-bars"/></svg>Compare</button>
</div>

<!-- TOWERS -->
<div class="page active" id="page-towers"><div class="grid" id="cardGrid"></div></div>

<!-- TRAITS -->
<div class="page" id="page-traits">
  <div class="row">
    <div><label>Search</label><input id="trSearch" placeholder="name or effect..." oninput="renderTraits()"></div>
    <div><label>Tower</label><select id="trTower" onchange="renderTraits()"></select></div>
  </div>
  <div class="scroll" id="traitList"></div>
</div>

<!-- COMPARE -->
<div class="page" id="page-compare">
  <div class="row">
    <div><label>Tower</label><select id="compTower" onchange="populateCompare()"></select></div>
    <div><label>Mode</label>
      <select id="compMode" onchange="renderComparison()">
        <option value="all">Compare All Allowed Traits</option>
        <option value="two">Compare 2 Traits</option>
      </select></div>
    <div id="trait1Group" style="display:none"><label>Trait 1</label><select id="compTrait1" onchange="renderComparison()"></select></div>
    <div id="trait2Group" style="display:none"><label>Trait 2</label><select id="compTrait2" onchange="renderComparison()"></select></div>
  </div>
  <div class="scroll" id="compareResults"></div>
</div>

<script>
const ic = (n) => `<svg class="ic"><use href="#i-${n}"/></svg>`;
const towerIcon = { income: "coin", vehicle: "car" };

const baseTowers = {
  "Tycoon": {
    type: "income", rating: null, baseLimit: 3,
    levels: [
      { price: 300, bonus: 150 }, { price: 1000, bonus: 500 },
      { price: 2500, bonus: 850 }, { price: 5000, bonus: 1500 }
    ],
    defaultCompare: ["Stonks 3", "Bargain 3"]
  },
  "Base": {
    type: "vehicle", rating: "A", baseLimit: 2,
    levels: [
      { price: 1150, vehicle: "Car",  dps: 1.66, cd: 15,   hp: 25,  speed: 3 },
      { price: 2500, vehicle: "Jeep", dps: 5.66, cd: 15,   hp: 85,  speed: 3 },
      { price: 5500, vehicle: "Limo", dps: 20,   cd: 15,   hp: 300, speed: 3 },
      { price: 9500, vehicle: "Tank", dps: 48,   cd: 12.5, hp: 600, speed: 1.75 }
    ],
    cannon: { damage: 200, explosion: 4, range: 17.5, cooldown: 2 },
    defaultCompare: ["Bargain 3", "Strength 3"]
  }
};

const DC = ["Superballer","Rocket","Lazer","c00lkidd","Headless.Mech","Crazy Robloxian","Chicken","Base"];
const globalTraits = {
  "None": { chance: "-", costMult: 1, incomeMult: 1, limitAdd: 0, desc: "No active trait effect.", towers: "All" },

  "Stonks 1": { chance: "29.17%", costMult: 1, incomeMult: 1.05, limitAdd: 0, desc: "Increases wave income by 5%", towers: ["Tycoon"] },
  "Stonks 2": { chance: "11.35%", costMult: 1, incomeMult: 1.15, limitAdd: 0, desc: "Increases wave income by 15%", towers: ["Tycoon"] },
  "Stonks 3": { chance: "3.24%", costMult: 1, incomeMult: 1.30, limitAdd: 0, desc: "Increases wave income by 30%", towers: ["Tycoon"] },
  "Tycoon Monopoly": { chance: "0.32%", costMult: 1.50, incomeMult: 2.00, limitAdd: 0, desc: "Increases wave income by 100%, +50% price", towers: ["Tycoon"] },

  "Bargain 1": { chance: "13.74%", costMult: 0.95, incomeMult: 1, limitAdd: 0, desc: "Reduces placement and upgrade cost by 5%", towers: "All" },
  "Bargain 2": { chance: "5%", costMult: 0.85, incomeMult: 1, limitAdd: 0, desc: "Reduces placement and upgrade cost by 15%", towers: "All" },
  "Bargain 3": { chance: "1.56%", costMult: 0.65, incomeMult: 1, limitAdd: 0, desc: "Reduces placement and upgrade cost by 35%", towers: "All" },
  "Extended Family": { chance: "1.25%", costMult: 1, incomeMult: 1, limitAdd: 1, desc: "Increases tower placement limit by 1", towers: "All" },
  "Overclocked": { chance: "0.19%", costMult: 1.30, incomeMult: 1, limitAdd: 0, dmg: 0.90, cd: 0.60, desc: "-40% cooldown, -10% dmg, +30% price", towers: "All" },
  "Hawkeye 1": { chance: "14.99%", costMult: 1, incomeMult: 1, limitAdd: 0, range: 1.10, desc: "Increases range by 10%", towers: "All" },
  "Hawkeye 2": { chance: "6.25%", costMult: 1, incomeMult: 1, limitAdd: 0, range: 1.20, desc: "Increases range by 20%", towers: "All" },
  "Hawkeye 3": { chance: "2.19%", costMult: 1, incomeMult: 1, limitAdd: 0, range: 1.30, desc: "Increases range by 30%", towers: "All" },
  "Cooldown 1": { chance: "12.49%", costMult: 1, incomeMult: 1, limitAdd: 0, cd: 0.95, desc: "Reduces cooldown by 5%", towers: "All" },
  "Cooldown 2": { chance: "5%", costMult: 1, incomeMult: 1, limitAdd: 0, cd: 0.90, desc: "Reduces cooldown by 10%", towers: "All" },
  "Cooldown 3": { chance: "1.25%", costMult: 1, incomeMult: 1, limitAdd: 0, cd: 0.85, desc: "Reduces cooldown by 15%", towers: "All" },
  "Strength 1": { chance: "11.24%", costMult: 1, incomeMult: 1, limitAdd: 0, dmg: 1.05, desc: "Increases damage by 5%", towers: "All" },
  "Strength 2": { chance: "5%", costMult: 1, incomeMult: 1, limitAdd: 0, dmg: 1.10, desc: "Increases damage by 10%", towers: "All" },
  "Strength 3": { chance: "0.94%", costMult: 1, incomeMult: 1, limitAdd: 0, dmg: 1.20, desc: "Increases damage by 20%", towers: "All" },
  "Gold Rush 1": { chance: "10.62%", costMult: 1, incomeMult: 1, limitAdd: 0, desc: "Earn 25% more cash from kills", towers: "All" },
  "Gold Rush 2": { chance: "5%", costMult: 1, incomeMult: 1, limitAdd: 0, desc: "Earn 45% more cash from kills", towers: "All" },
  "Goldrush 3": { chance: "1.56%", costMult: 1, incomeMult: 1, limitAdd: 0, desc: "Earn 75% more cash from kills", towers: "All" },
  "Tank": { chance: "1.25%", costMult: 1, incomeMult: 1, limitAdd: 0, dmg: 1.60, cd: 1.40, desc: "+60% damage, +40% cooldown", towers: "All" },
  "Midas Touch": { chance: "0.22%", costMult: 1, incomeMult: 1, limitAdd: 0, cd: 1.10, desc: "+200% kill income, +10% cooldown", towers: "All" },
  "Deadeye": { chance: "0.16%", costMult: 1, incomeMult: 1, limitAdd: 0, range: 1.40, dmg: 1.30, cd: 1.15, desc: "+40% range, +30% damage, +15% cooldown", towers: "All" },

  "bonded 1": { chance: "26.43%", costMult: 1, incomeMult: 1, limitAdd: 0, desc: "+5% mimic duration", towers: ["Body swap"] },
  "bonded 2": { chance: "11.75%", costMult: 1, incomeMult: 1, limitAdd: 0, desc: "+15% mimic duration", towers: ["Body swap"] },
  "bonded 3": { chance: "0.75%", costMult: 1, incomeMult: 1, limitAdd: 0, desc: "+40% mimic duration", towers: ["Body swap"] },
  "dangerous 1": { chance: "8.81%", costMult: 1, incomeMult: 1, limitAdd: 0, desc: "+10% damage multiplier", towers: ["Body swap"] },
  "dangerous 2": { chance: "1.47%", costMult: 1, incomeMult: 1, limitAdd: 0, desc: "+15% damage multiplier", towers: ["Body swap"] },
  "dangerous 3": { chance: "0.15%", costMult: 1, incomeMult: 1, limitAdd: 0, desc: "+25% damage multiplier", towers: ["Body swap"] },
  "Danger Close 1": { chance: "8.28%", costMult: 1, incomeMult: 1, limitAdd: 0, blast: 1.10, desc: "+10% explosive radius", towers: DC },
  "Danger Close 2": { chance: "3.31%", costMult: 1, incomeMult: 1, limitAdd: 0, blast: 1.20, desc: "+20% explosive radius", towers: DC },
  "Danger Close 3": { chance: "1.1%", costMult: 1, incomeMult: 1, limitAdd: 0, blast: 1.35, desc: "+35% explosive radius", towers: DC },
  "Extended Mag 1": { chance: "8.1%", costMult: 1, incomeMult: 1, limitAdd: 0, desc: "+25% ammo", towers: ["Bacon","Pistoler","Bling Bacon","Jolly Elf","Gunner"] },
  "Extended Mag 2": { chance: "4.32%", costMult: 1, incomeMult: 1, limitAdd: 0, desc: "+50% ammo", towers: ["Bacon","Pistoler","Bling Bacon","Jolly Elf","Gunner"] },
  "Extended Mag 3": { chance: "2.16%", costMult: 1, incomeMult: 1, limitAdd: 0, desc: "+100% ammo", towers: ["Bacon","Pistoler","Bling Bacon","Jolly Elf","Gunner"] },
  "Another One": { chance: "1.52%", costMult: 1, incomeMult: 1, limitAdd: 0, desc: "Deals four cards instead of three", towers: ["Chance"] },
  "Twinning": { chance: "0.16%", costMult: 1.30, incomeMult: 1, limitAdd: 2, desc: "+2 Limit, +30% price", towers: ["Heroics"] },
  "Mass Production": { chance: "0.13%", costMult: 1, incomeMult: 1, limitAdd: 2, dmg: 0.80, desc: "+2 Limit, -20% damage", towers: "All_Except_Support", excluded: ["DJ","Tycoon","Helper Bot","Bloxy Cola","Pizza Guy","LAZER"] }
};
for (const k in globalTraits) {
  const t = globalTraits[k];
  if (t.dmg === undefined) t.dmg = 1;
  if (t.cd === undefined) t.cd = 1;
  if (t.range === undefined) t.range = 1;
  if (t.blast === undefined) t.blast = 1;
}

const compareColumns = {
  income: [
    ["traitName","Trait",d=>`<b>${d.traitName}</b>`],
    ["numChance","Chance",d=>d.chance],
    ["limit","Limit",d=>d.limit],
    ["totalCostOne","Cost (1)",d=>`$${d.totalCostOne.toLocaleString()}`],
    ["totalCostAll","Cost (All)",d=>`<span class="highlight">$${d.totalCostAll.toLocaleString()}</span>`],
    ["maxLevelBonusOne","Max Bonus (1)",d=>`+$${d.maxLevelBonusOne.toLocaleString()}`],
    ["maxLevelBonusAll","Max Bonus (All)",d=>`+$${d.maxLevelBonusAll.toLocaleString()}`],
    ["paybackCyclesOne","Payback Waves (1)",d=>d.paybackCyclesOne===999999?'N/A':d.paybackCyclesOne.toFixed(2)]
  ],
  vehicle: [
    ["traitName","Trait",d=>`<b>${d.traitName}</b>`],
    ["numChance","Chance",d=>d.chance],
    ["limit","Limit",d=>d.limit],
    ["totalCostOne","Cost (1)",d=>`$${d.totalCostOne.toLocaleString()}`],
    ["totalCostAll","Cost (All)",d=>`<span class="highlight">$${d.totalCostAll.toLocaleString()}</span>`],
    ["ramDpsOne","Ram DPS (1)",d=>fmt(d.ramDpsOne)],
    ["ramDpsAll","Ram DPS (All)",d=>fmt(d.ramDpsAll)],
    ["spawnCd","Spawn CD",d=>`${fmt(d.spawnCd)}s`],
    ["cannonDamage","Cannon Dmg",d=>fmt(d.cannonDamage)],
    ["cannonCd","Cannon CD",d=>`${fmt(d.cannonCd)}s`],
    ["cannonDpsOne","Cannon DPS (1)",d=>fmt(d.cannonDpsOne)],
    ["cannonDpsAll","Cannon DPS (All)",d=>fmt(d.cannonDpsAll)],
    ["cannonRange","Range",d=>`${fmt(d.cannonRange)}m`],
    ["cannonBlast","Blast",d=>`${fmt(d.cannonBlast)}m`]
  ]
};

let currentTowerName = "Tycoon", sortKey = null, sortAsc = true;
const fmt = n => parseFloat(n.toFixed(2)).toLocaleString();
const slug = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');

function getTraitsForTower(towerName) {
  const out = {};
  for (const n in globalTraits) {
    const tr = globalTraits[n];
    if (tr.excluded && tr.excluded.includes(towerName)) continue;
    if (tr.towers === "All" || tr.towers === "All_Except_Support" ||
        (Array.isArray(tr.towers) && tr.towers.includes(towerName))) out[n] = tr;
  }
  return out;
}

/* ---------- TABS ---------- */
function showTab(id) {
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + id));
}

/* ---------- TOWERS TAB ---------- */
function buildCards() {
  const grid = document.getElementById('cardGrid');
  grid.innerHTML = '';
  for (const name in baseTowers) {
    const tower = baseTowers[name], id = slug(name);
    const headers = tower.type === "income"
      ? `<th>Lvl</th><th>${ic('coin')}Price</th><th>Bonus Cash</th>`
      : `<th>Lvl</th><th>${ic('car')}Vehicle</th><th>${ic('coin')}Price</th><th>${ic('bolt')}Ram DPS</th><th>${ic('clock')}CD</th><th>${ic('heart')}HP</th><th>${ic('gauge')}Spd</th>`;
    const ratingHtml = tower.rating ? `<span class="rating">[${tower.rating}]</span>` : '';
    const extra = tower.type === "vehicle"
      ? `<br>${ic('blast')}<span style="color:#aaa">Lv4 Cannon:</span> <span id="${id}-cannon"></span>` : '';
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="title"><span>${ic(towerIcon[tower.type])}${name}${ratingHtml}</span><span id="${id}-limit"></span></div>
      <label>Select Trait:</label>
      <select id="${id}-trait" onchange="updateCard('${name}')"></select>
      <button onclick="openCompare('${name}')">${ic('bars')}Calculate Traits (Compare)</button>
      <div class="trait-desc" id="${id}-desc"></div>
      <div class="scroll"><table><thead><tr>${headers}</tr></thead><tbody id="${id}-table"></tbody></table></div>
      <div class="summary">
        ${ic('coin')}Maxing 1 Unit: <span class="highlight" id="${id}-cost-1"></span><br>
        ${ic('box')}Maxing All (<span id="${id}-count"></span>): <span class="highlight" id="${id}-cost-max"></span>
        ${extra}
      </div>`;
    grid.appendChild(card);
    const select = document.getElementById(`${id}-trait`);
    const traits = getTraitsForTower(name);
    for (const t in traits) select.add(new Option(`${t} (${traits[t].chance})`, t));
    updateCard(name);
  }
}

function updateCard(name) {
  const tower = baseTowers[name], id = slug(name);
  const traits = getTraitsForTower(name);
  const trait = traits[document.getElementById(`${id}-trait`).value] || globalTraits["None"];
  document.getElementById(`${id}-desc`).textContent = `[Chance: ${trait.chance}] ${trait.desc}`;

  const limit = tower.baseLimit + trait.limitAdd;
  document.getElementById(`${id}-limit`).textContent = `Max: ${limit}`;
  document.getElementById(`${id}-count`).textContent = limit;

  let rows = '', total = 0;
  tower.levels.forEach((lvl, i) => {
    const price = Math.round(lvl.price * trait.costMult);
    total += price;
    rows += tower.type === "income"
      ? `<tr><td>${i+1}</td><td>$${price.toLocaleString()}</td><td>+$${Math.round(lvl.bonus * trait.incomeMult).toLocaleString()}</td></tr>`
      : `<tr><td>${i+1}</td><td>${lvl.vehicle}</td><td>$${price.toLocaleString()}</td><td>${fmt(lvl.dps*trait.dmg)}</td><td>${fmt(lvl.cd*trait.cd)}s</td><td>${lvl.hp}</td><td>${lvl.speed}</td></tr>`;
  });
  document.getElementById(`${id}-table`).innerHTML = rows;
  document.getElementById(`${id}-cost-1`).textContent = `$${total.toLocaleString()}`;
  document.getElementById(`${id}-cost-max`).textContent = `$${(total * limit).toLocaleString()}`;

  if (tower.type === "vehicle") {
    const c = tower.cannon;
    document.getElementById(`${id}-cannon`).textContent =
      `${fmt(c.damage*trait.dmg)} dmg, ${fmt(c.cooldown*trait.cd)}s CD, ${fmt(c.range*trait.range)}m range, ${fmt(c.explosion*trait.blast)}m blast`;
  }
}

/* ---------- TRAITS TAB ---------- */
function initTraitsTab() {
  const sel = document.getElementById('trTower');
  sel.add(new Option('All towers', ''));
  for (const n in baseTowers) sel.add(new Option(n, n));
  renderTraits();
}
function renderTraits() {
  const q = document.getElementById('trSearch').value.toLowerCase();
  const tw = document.getElementById('trTower').value;
  const list = tw ? getTraitsForTower(tw) : globalTraits;
  let html = `<table><thead><tr><th>${ic('spark')}Trait</th><th>${ic('dice')}Chance</th><th>Effect</th><th>${ic('tower')}Towers</th></tr></thead><tbody>`;
  for (const n in list) {
    if (n === "None") continue;
    const t = list[n];
    if (q && !(n + ' ' + t.desc).toLowerCase().includes(q)) continue;
    const tw2 = Array.isArray(t.towers) ? t.towers.map(x => `<span class="chip">${x}</span>`).join('')
      : `<span class="chip">${t.towers === "All" ? "All towers" : "All except support"}</span>`;
    html += `<tr><td><b>${n}</b></td><td class="pill">${t.chance}</td><td>${t.desc}</td><td>${tw2}</td></tr>`;
  }
  document.getElementById('traitList').innerHTML = html + '</tbody></table>';
}

/* ---------- COMPARE TAB ---------- */
function initCompareTab() {
  const sel = document.getElementById('compTower');
  for (const n in baseTowers) sel.add(new Option(n, n));
  populateCompare();
}
function openCompare(name) {
  document.getElementById('compTower').value = name;
  populateCompare();
  showTab('compare');
}
function populateCompare() {
  currentTowerName = document.getElementById('compTower').value;
  sortKey = null; sortAsc = true;
  const traits = getTraitsForTower(currentTowerName), keys = Object.keys(traits);
  ['compTrait1', 'compTrait2'].forEach(id => {
    const s = document.getElementById(id);
    s.innerHTML = '';
    keys.forEach(t => s.add(new Option(`${t} (${traits[t].chance})`, t)));
  });
  const defs = baseTowers[currentTowerName].defaultCompare || [];
  if (keys.includes(defs[0])) document.getElementById('compTrait1').value = defs[0];
  if (keys.includes(defs[1])) document.getElementById('compTrait2').value = defs[1];
  renderComparison();
}
function toggleSort(key) {
  if (sortKey === key) sortAsc = !sortAsc; else { sortKey = key; sortAsc = true; }
  renderComparison();
}
function getTowerTraitMetrics(towerName, traitKey) {
  const tower = baseTowers[towerName], trait = globalTraits[traitKey];
  const limit = tower.baseLimit + trait.limitAdd;
  let totalCostOne = 0;
  tower.levels.forEach(l => totalCostOne += Math.round(l.price * trait.costMult));
  let numChance = parseFloat(trait.chance.replace('%', ''));
  if (isNaN(numChance)) numChance = -1;
  const base = { traitName: traitKey, chance: trait.chance, numChance, limit, totalCostOne, totalCostAll: totalCostOne * limit };
  const last = tower.levels[tower.levels.length - 1];

  if (tower.type === "income") {
    const b = Math.round(last.bonus * trait.incomeMult);
    return { ...base, maxLevelBonusOne: b, maxLevelBonusAll: b * limit, paybackCyclesOne: b > 0 ? totalCostOne / b : 999999 };
  }
  const c = tower.cannon;
  const cannonDamage = c.damage * trait.dmg, cannonCd = c.cooldown * trait.cd;
  const cannonDpsOne = cannonDamage / cannonCd, ramDpsOne = last.dps * trait.dmg;
  return { ...base, ramDpsOne, ramDpsAll: ramDpsOne * limit, spawnCd: last.cd * trait.cd,
    cannonDamage, cannonCd, cannonDpsOne, cannonDpsAll: cannonDpsOne * limit,
    cannonRange: c.range * trait.range, cannonBlast: c.explosion * trait.blast };
}
function renderComparison() {
  const two = document.getElementById('compMode').value === 'two';
  document.getElementById('trait1Group').style.display = two ? 'block' : 'none';
  document.getElementById('trait2Group').style.display = two ? 'block' : 'none';
  const cols = compareColumns[baseTowers[currentTowerName].type];
  const traitList = two
    ? [document.getElementById('compTrait1').value, document.getElementById('compTrait2').value]
    : Object.keys(getTraitsForTower(currentTowerName));
  const data = traitList.map(k => getTowerTraitMetrics(currentTowerName, k));
  if (sortKey) data.sort((a, b) => typeof a[sortKey] === 'string'
    ? (sortAsc ? a[sortKey].localeCompare(b[sortKey]) : b[sortKey].localeCompare(a[sortKey]))
    : (sortAsc ? a[sortKey] - b[sortKey] : b[sortKey] - a[sortKey]));
  const arrow = k => sortKey !== k ? '<span class="sort-arrow">▲▼</span>'
    : `<span class="sort-arrow active">${sortAsc ? '▲' : '▼'}</span>`;
  let html = '<table class="comp-table"><thead><tr>' +
    cols.map(([k, label]) => `<th onclick="toggleSort('${k}')">${label} ${arrow(k)}</th>`).join('') + '</tr></thead><tbody>';
  data.forEach(d => html += '<tr>' + cols.map(c => `<td>${c[2](d)}</td>`).join('') + '</tr>');
  document.getElementById('compareResults').innerHTML = html + '</tbody></table>';
}

buildCards();
initTraitsTab();
initCompareTab();
</script>
