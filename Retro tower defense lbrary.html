<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TD Stats Library</title>
    <style>
        body { background: #121212; color: #fff; font-family: monospace; padding: 20px; }
        .grid { display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-start; }
        .card { background: #1e1e1e; border: 1px solid #333; padding: 12px; width: 380px; box-sizing: border-box; }
        .title { font-weight: bold; font-size: 16px; margin-bottom: 8px; border-bottom: 1px solid #333; padding-bottom: 4px; display: flex; justify-content: space-between; }
        select, button { background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 5px; font-family: monospace; width: 100%; margin-bottom: 8px; box-sizing: border-box; }
        button { cursor: pointer; background: #333; font-weight: bold; }
        button:hover { background: #444; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; margin-bottom: 10px; }
        td, th { border: 1px solid #333; padding: 4px; text-align: left; }
        th { background: #252525; }
        .summary { font-size: 13px; line-height: 1.4; border-top: 1px dashed #444; padding-top: 8px; }
        .highlight { color: #55ff55; }
        .trait-desc { color: #aaa; font-size: 11px; margin-bottom: 8px; min-height: 26px; }
        .rating { color: #ffcc44; font-size: 12px; margin-left: 6px; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #1e1e1e; border: 1px solid #555; padding: 20px; max-width: 1100px; width: 95%; max-height: 90vh; overflow: auto; box-sizing: border-box; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; padding-bottom: 8px; margin-bottom: 15px; }
        .modal-header h2 { margin: 0; font-size: 18px; }
        .close-btn { width: auto; padding: 2px 8px; background: #622; color: #f88; margin-bottom: 0; }
        .comp-table th, .comp-table td { font-size: 11px; padding: 6px; }
        .comp-table th { cursor: pointer; user-select: none; }
        .comp-table th:hover { background: #333; }
        .comp-select-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .comp-select-group div { flex: 1; }
        .sort-arrow { font-size: 10px; margin-left: 3px; color: #666; }
        .sort-arrow.active { color: #55ff55; }
    </style>
</head>
<body>

    <div class="grid" id="cardGrid"></div>

    <!-- COMPARISON MODAL -->
    <div class="modal" id="compareModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Trait Comparison</h2>
                <button class="close-btn" onclick="closeCompareModal()">X</button>
            </div>

            <div class="comp-select-group">
                <div>
                    <label style="font-size: 11px;">Mode:</label>
                    <select id="compMode" onchange="renderComparison()">
                        <option value="all">Compare All Allowed Traits</option>
                        <option value="two">Compare 2 Traits</option>
                    </select>
                </div>
                <div id="trait1Group" style="display: none;">
                    <label style="font-size: 11px;">Trait 1:</label>
                    <select id="compTrait1" onchange="renderComparison()"></select>
                </div>
                <div id="trait2Group" style="display: none;">
                    <label style="font-size: 11px;">Trait 2:</label>
                    <select id="compTrait2" onchange="renderComparison()"></select>
                </div>
            </div>

            <div id="compareResults"></div>
        </div>
    </div>

    <script>
        const baseTowers = {
            "Tycoon": {
                type: "income",
                rating: null,
                baseLimit: 3,
                levels: [
                    { price: 300, bonus: 150 },
                    { price: 1000, bonus: 500 },
                    { price: 2500, bonus: 850 },
                    { price: 5000, bonus: 1500 }
                ],
                defaultCompare: ["Stonks 3", "Bargain 3"]
            },
            "Base": {
                type: "vehicle",
                rating: "A",
                noTraits: true,
                baseLimit: 2,
                levels: [
                    { price: 1150, vehicle: "Car",  dps: 1.66, cd: 15,   hp: 25,  speed: 3 },
                    { price: 2500, vehicle: "Jeep", dps: 5.66, cd: 15,   hp: 85,  speed: 3 },
                    { price: 5500, vehicle: "Limo", dps: 20,   cd: 15,   hp: 300, speed: 3 },
                    { price: 9500, vehicle: "Tank", dps: 48,   cd: 12.5, hp: 600, speed: 1.75 }
                ],
                // Cannon unlocks at Lv4
                cannon: { damage: 200, explosion: 4, range: 17.5, cooldown: 2 },
                defaultCompare: ["Bargain 3", "Strength 3"]
            }
        };

        // dmg / cd / range = stat multipliers (used by vehicle towers like Base)
        const globalTraits = {
            "None": { chance: "-", costMult: 1, incomeMult: 1, limitAdd: 0, dmg: 1, cd: 1, range: 1, desc: "No active trait effect.", towers: "All" },

            // Tycoon exclusive
            "Stonks 1": { chance: "29.17%", costMult: 1, incomeMult: 1.05, limitAdd: 0, desc: "Increases wave income by 5%", towers: ["Tycoon"] },
            "Stonks 2": { chance: "11.35%", costMult: 1, incomeMult: 1.15, limitAdd: 0, desc: "Increases wave income by 15%", towers: ["Tycoon"] },
            "Stonks 3": { chance: "3.24%", costMult: 1, incomeMult: 1.30, limitAdd: 0, desc: "Increases wave income by 30%", towers: ["Tycoon"] },
            "Tycoon Monopoly": { chance: "0.32%", costMult: 1.50, incomeMult: 2.00, limitAdd: 0, desc: "Increases wave income by 100%, +50% price", towers: ["Tycoon"] },

            // All Towers
            "Bargain 1": { chance: "13.74%", costMult: 0.95, incomeMult: 1, limitAdd: 0, desc: "Reduces placement and upgrade cost by 5%", towers: "All" },
            "Bargain 2": { chance: "5%", costMult: 0.85, incomeMult: 1, limitAdd: 0, desc: "Reduces placement and upgrade cost by 15%", towers: "All" },
            "Bargain 3": { chance: "1.56%", costMult: 0.65, incomeMult: 1, limitAdd: 0, desc: "Reduces placement and upgrade cost by 35%", towers: "All" },
            "Extended Family": { chance: "1.25%", costMult: 1, incomeMult: 1, limitAdd: 1, desc: "Increases tower placement limit by 1", towers: "All" },
            "Overclocked": { chance: "0.19%", costMult: 1.30, incomeMult: 1, limitAdd: 0, dmg: 0.90, cd: 0.60, desc: "-40% cooldown, -10% dmg, +30% price", towers: "All" },
            "Hawkeye 1": { chance: "14.99%", costMult: 1, incomeMult: 1, limitAdd: 0, range: 1.10, desc: "Increases range by 10%", towers: "All" },
            "Hawkeye 2": { chance: "6.25%", costMult: 1, incomeMult: 1, limitAdd: 0, range: 1.20, desc: "Increases range by 20%", towers: "All" },
            "Hawkeye 3": { chance: "2.19%", costMult: 1, incomeMult: 1, limitAdd: 0, range: 1.30, desc: "Increases range by 30%", towers: "All" },
            "Cooldown 1": { chance: "12.49%", costMult: 1, incomeMult: 1, limitAdd: 0, cd: 0.95, desc: "Reduces cooldown by 5%", towers: "All" },
            "Cooldown 2": { chance: "5%", costMult: 1, incomeMult: 1, limitAdd: 0, cd: 0.90, desc: "Reduces cooldown by 10%", towers: "All" },
            "Cooldown 3": { chance: "1.25%", costMult: 1, incomeMult: 1, limitAdd: 0, cd: 0.85, desc: "Reduces cooldown by 15%", towers: "All" },
            "Strength 1": { chance: "11.24%", costMult: 1, incomeMult: 1, limitAdd: 0, dmg: 1.05, desc: "Increases damage by 5%", towers: "All" },
            "Strength 2": { chance: "5%", costMult: 1, incomeMult: 1, limitAdd: 0, dmg: 1.10, desc: "Increases damage by 10%", towers: "All" },
            "Strength 3": { chance: "0.94%", costMult: 1, incomeMult: 1, limitAdd: 0, dmg: 1.20, desc: "Increases damage by 20%", towers: "All" },
            "Gold Rush 1": { chance: "10.62%", costMult: 1, incomeMult: 1, limitAdd: 0, desc: "Earn 25% more cash from kills", towers: "All" },
            "Gold Rush 2": { chance: "5%", costMult: 1, incomeMult: 1, limitAdd: 0, desc: "Earn 45% more cash from kills", towers: "All" },
            "Goldrush 3": { chance: "1.56%", costMult: 1, incomeMult: 1, limitAdd: 0, desc: "Earn 75% more cash from kills", towers: "All" },
            "Tank": { chance: "1.25%", costMult: 1, incomeMult: 1, limitAdd: 0, dmg: 1.60, cd: 1.40, desc: "+60% damage, +40% cooldown", towers: "All" },
            "Midas Touch": { chance: "0.22%", costMult: 1, incomeMult: 1, limitAdd: 0, cd: 1.10, desc: "+200% kill income, +10% cooldown", towers: "All" },
            "Deadeye": { chance: "0.16%", costMult: 1, incomeMult: 1, limitAdd: 0, range: 1.40, dmg: 1.30, cd: 1.15, desc: "+40% range, +30% damage, +15% cooldown", towers: "All" },

            // Non-Tycoon Specifics
            "bonded 1": { chance: "26.43%", costMult: 1, incomeMult: 1, limitAdd: 0, desc: "+5% mimic duration", towers: ["Body swap"] },
            "bonded 2": { chance: "11.75%", costMult: 1, incomeMult: 1, limitAdd: 0, desc: "+15% mimic duration", towers: ["Body swap"] },
            "bonded 3": { chance: "0.75%", costMult: 1, incomeMult: 1, limitAdd: 0, desc: "+40% mimic duration", towers: ["Body swap"] },
            "dangerous 1": { chance: "8.81%", costMult: 1, incomeMult: 1, limitAdd: 0, desc: "+10% damage multiplier", towers: ["Body swap"] },
            "dangerous 2": { chance: "1.47%", costMult: 1, incomeMult: 1, limitAdd: 0, desc: "+15% damage multiplier", towers: ["Body swap"] },
            "dangerous 3": { chance: "0.15%", costMult: 1, incomeMult: 1, limitAdd: 0, desc: "+25% damage multiplier", towers: ["Body swap"] },
            "Danger Close 1": { chance: "8.28%", costMult: 1, incomeMult: 1, limitAdd: 0, desc: "+10% explosive radius", towers: ["Superballer", "Rocket", "Lazer", "c00lkidd", "Headless.Mech", "Crazy Robloxian", "Chicken"] },
            "Danger Close 2": { chance: "3.31%", costMult: 1, incomeMult: 1, limitAdd: 0, desc: "+20% explosive radius", towers: ["Superballer", "Rocket", "Lazer", "c00lkidd", "Headless.Mech", "Crazy Robloxian", "Chicken"] },
            "Danger Close 3": { chance: "1.1%", costMult: 1, incomeMult: 1, limitAdd: 0, desc: "+35% explosive radius", towers: ["Superballer", "Rocket", "Lazer", "c00lkidd", "Headless.Mech", "Crazy Robloxian", "Chicken"] },
            "Extended Mag 1": { chance: "8.1%", costMult: 1, incomeMult: 1, limitAdd: 0, desc: "+25% ammo", towers: ["Bacon", "Pistoler", "Bling Bacon", "Jolly Elf", "Gunner"] },
            "Extended Mag 2": { chance: "4.32%", costMult: 1, incomeMult: 1, limitAdd: 0, desc: "+50% ammo", towers: ["Bacon", "Pistoler", "Bling Bacon", "Jolly Elf", "Gunner"] },
            "Extended Mag 3": { chance: "2.16%", costMult: 1, incomeMult: 1, limitAdd: 0, desc: "+100% ammo", towers: ["Bacon", "Pistoler", "Bling Bacon", "Jolly Elf", "Gunner"] },
            "Another One": { chance: "1.52%", costMult: 1, incomeMult: 1, limitAdd: 0, desc: "Deals four cards instead of three", towers: ["Chance"] },
            "Twinning": { chance: "0.16%", costMult: 1.30, incomeMult: 1, limitAdd: 2, desc: "+2 Limit, +30% price", towers: ["Heroics"] },
            "Mass Production": { chance: "0.13%", costMult: 1, incomeMult: 1, limitAdd: 2, dmg: 0.80, desc: "+2 Limit, -20% damage", towers: "All_Except_Support", excluded: ["DJ", "Tycoon", "Helper Bot", "Bloxy Cola", "Pizza Guy", "LAZER"] }
        };

        // Fill in default multipliers
        for (const k in globalTraits) {
            const t = globalTraits[k];
            if (t.dmg === undefined) t.dmg = 1;
            if (t.cd === undefined) t.cd = 1;
            if (t.range === undefined) t.range = 1;
        }

        // Comparison table columns per tower type
        const compareColumns = {
            income: [
                ["traitName", "Trait", d => `<b>${d.traitName}</b>`],
                ["numChance", "Chance", d => d.chance],
                ["limit", "Limit", d => d.limit],
                ["totalCostOne", "Cost (1 Unit)", d => `$${d.totalCostOne.toLocaleString()}`],
                ["totalCostAll", "Cost (All)", d => `<span class="highlight">$${d.totalCostAll.toLocaleString()}</span>`],
                ["maxLevelBonusOne", "Max Bonus (1)", d => `+$${d.maxLevelBonusOne.toLocaleString()}`],
                ["maxLevelBonusAll", "Max Bonus (All)", d => `+$${d.maxLevelBonusAll.toLocaleString()}`],
                ["paybackCyclesOne", "Payback Waves (1)", d => d.paybackCyclesOne === 999999 ? 'N/A' : d.paybackCyclesOne.toFixed(2)]
            ],
            vehicle: [
                ["traitName", "Trait", d => `<b>${d.traitName}</b>`],
                ["numChance", "Chance", d => d.chance],
                ["limit", "Limit", d => d.limit],
                ["totalCostOne", "Cost (1 Unit)", d => `$${d.totalCostOne.toLocaleString()}`],
                ["totalCostAll", "Cost (All)", d => `<span class="highlight">$${d.totalCostAll.toLocaleString()}</span>`],
                ["ramDpsOne", "Tank Ram DPS (1)", d => fmt(d.ramDpsOne)],
                ["ramDpsAll", "Tank Ram DPS (All)", d => fmt(d.ramDpsAll)],
                ["spawnCd", "Spawn CD", d => `${fmt(d.spawnCd)}s`],
                ["cannonDamage", "Cannon Dmg", d => fmt(d.cannonDamage)],
                ["cannonCd", "Cannon CD", d => `${fmt(d.cannonCd)}s`],
                ["cannonDpsOne", "Cannon DPS (1)", d => fmt(d.cannonDpsOne)],
                ["cannonDpsAll", "Cannon DPS (All)", d => fmt(d.cannonDpsAll)],
                ["cannonRange", "Range", d => `${fmt(d.cannonRange)}m`]
            ]
        };

        let currentTowerName = "Tycoon";
        let sortKey = null;
        let sortAsc = true;

        function fmt(n) { return parseFloat(n.toFixed(2)).toLocaleString(); }
        function slug(name) { return name.toLowerCase().replace(/[^a-z0-9]/g, ''); }

        function getTraitsForTower(towerName) {
            let available = {};
            for (let traitName in globalTraits) {
                let tr = globalTraits[traitName];
                if (tr.excluded && tr.excluded.includes(towerName)) continue;
                if (tr.towers === "All" || tr.towers === "All_Except_Support") {
                    available[traitName] = tr;
                } else if (Array.isArray(tr.towers) && tr.towers.includes(towerName)) {
                    available[traitName] = tr;
                }
            }
            return available;
        }

        /* ---------- CARDS ---------- */
        function buildCards() {
            const grid = document.getElementById('cardGrid');
            grid.innerHTML = '';
            for (const name in baseTowers) {
                const tower = baseTowers[name];
                const id = slug(name);
                const headers = tower.type === "income"
                    ? '<th>Lvl</th><th>Price</th><th>Bonus Cash</th>'
                    : '<th>Lvl</th><th>Vehicle</th><th>Price</th><th>Ram DPS</th><th>CD</th><th>HP</th><th>Spd</th>';
                const ratingHtml = tower.rating ? `<span class="rating">[${tower.rating}]</span>` : '';
                const extra = tower.type === "vehicle"
                    ? `<br><span style="color:#aaa;">Lv4 Cannon:</span> <span id="${id}-cannon"></span>` : '';

                const card = document.createElement('div');
                card.className = 'card';
                card.id = `${id}-card`;
                card.innerHTML = `
                    <div class="title">
                        <span>${name}${ratingHtml}</span>
                        <span id="${id}-limit">Max: ${tower.baseLimit}</span>
                    </div>
                    ${tower.noTraits ? '<div class="trait-desc">This tower cannot roll traits.</div>' : `
                    <label style="font-size: 11px;">Select Trait:</label>
                    <select id="${id}-trait" onchange="updateCard('${name}')"></select>
                    <button onclick="openCompareModal('${name}')">Calculate Traits (Compare)</button>
                    <div class="trait-desc" id="${id}-desc">No active trait effect.</div>`}
                    <table>
                        <thead><tr>${headers}</tr></thead>
                        <tbody id="${id}-table"></tbody>
                    </table>
                    <div class="summary">
                        Maxing 1 Unit: <span class="highlight" id="${id}-cost-1">$0</span><br>
                        Maxing All (<span id="${id}-count">${tower.baseLimit}</span>): <span class="highlight" id="${id}-cost-max">$0</span>
                        ${extra}
                    </div>`;
                grid.appendChild(card);

                const select = document.getElementById(`${id}-trait`);
                const traits = tower.noTraits ? {} : getTraitsForTower(name);
                for (let t in traits) {
                    const opt = document.createElement('option');
                    opt.value = t;
                    opt.textContent = `${t} (${traits[t].chance})`;
                    select.appendChild(opt);
                }
                updateCard(name);
            }
        }

        function updateCard(name) {
            const tower = baseTowers[name];
            const id = slug(name);
            let trait = globalTraits["None"];
            if (!tower.noTraits) {
                const traits = getTraitsForTower(name);
                const selected = document.getElementById(`${id}-trait`).value || "None";
                trait = traits[selected] || globalTraits["None"];
                document.getElementById(`${id}-desc`).textContent = `[Chance: ${trait.chance}] ${trait.desc}`;
            }

            const limit = tower.baseLimit + trait.limitAdd;
            document.getElementById(`${id}-limit`).textContent = `Max: ${limit}`;
            document.getElementById(`${id}-count`).textContent = limit;

            let rows = '';
            let totalOneCost = 0;

            tower.levels.forEach((lvl, idx) => {
                const finalPrice = Math.round(lvl.price * trait.costMult);
                totalOneCost += finalPrice;

                if (tower.type === "income") {
                    const finalBonus = Math.round(lvl.bonus * trait.incomeMult);
                    rows += `<tr><td>${idx + 1}</td><td>$${finalPrice.toLocaleString()}</td><td>+$${finalBonus.toLocaleString()}</td></tr>`;
                } else {
                    rows += `<tr>
                        <td>${idx + 1}</td>
                        <td>${lvl.vehicle}</td>
                        <td>$${finalPrice.toLocaleString()}</td>
                        <td>${fmt(lvl.dps * trait.dmg)}</td>
                        <td>${fmt(lvl.cd * trait.cd)}s</td>
                        <td>${lvl.hp}</td>
                        <td>${lvl.speed}</td>
                    </tr>`;
                }
            });

            document.getElementById(`${id}-table`).innerHTML = rows;
            document.getElementById(`${id}-cost-1`).textContent = `$${totalOneCost.toLocaleString()}`;
            document.getElementById(`${id}-cost-max`).textContent = `$${(totalOneCost * limit).toLocaleString()}`;

            if (tower.type === "vehicle") {
                const c = tower.cannon;
                document.getElementById(`${id}-cannon`).innerHTML =
                    `${fmt(c.damage * trait.dmg)} dmg, ${fmt(c.cooldown * trait.cd)}s CD, ${fmt(c.range * trait.range)}m range, ${c.explosion}m blast`;
            }
        }

        /* ---------- COMPARISON ---------- */
        function openCompareModal(towerName) {
            if (currentTowerName !== towerName) { sortKey = null; sortAsc = true; }
            currentTowerName = towerName;
            document.getElementById('modalTitle').textContent = `Trait Comparison - ${towerName}`;

            const traits = getTraitsForTower(towerName);
            const trait1Sel = document.getElementById('compTrait1');
            const trait2Sel = document.getElementById('compTrait2');
            trait1Sel.innerHTML = '';
            trait2Sel.innerHTML = '';

            const keys = Object.keys(traits);
            keys.forEach((t) => {
                trait1Sel.innerHTML += `<option value="${t}">${t} (${traits[t].chance})</option>`;
                trait2Sel.innerHTML += `<option value="${t}">${t} (${traits[t].chance})</option>`;
            });

            const defs = baseTowers[towerName].defaultCompare || [];
            if (keys.includes(defs[0])) trait1Sel.value = defs[0];
            if (keys.includes(defs[1])) trait2Sel.value = defs[1];

            document.getElementById('compareModal').style.display = 'flex';
            renderComparison();
        }

        function closeCompareModal() {
            document.getElementById('compareModal').style.display = 'none';
        }

        function toggleSort(key) {
            if (sortKey === key) {
                sortAsc = !sortAsc;
            } else {
                sortKey = key;
                sortAsc = true;
            }
            renderComparison();
        }

        function getTowerTraitMetrics(towerName, traitKey) {
            const tower = baseTowers[towerName];
            const trait = globalTraits[traitKey];
            const limit = tower.baseLimit + trait.limitAdd;

            let totalCostOne = 0;
            tower.levels.forEach(lvl => { totalCostOne += Math.round(lvl.price * trait.costMult); });
            const totalCostAll = totalCostOne * limit;

            let numChance = parseFloat(trait.chance.replace('%', ''));
            if (isNaN(numChance)) numChance = -1;

            const base = { traitName: traitKey, chance: trait.chance, numChance, limit, totalCostOne, totalCostAll };
            const last = tower.levels[tower.levels.length - 1];

            if (tower.type === "income") {
                const maxLevelBonusOne = Math.round(last.bonus * trait.incomeMult);
                return {
                    ...base,
                    maxLevelBonusOne,
                    maxLevelBonusAll: maxLevelBonusOne * limit,
                    paybackCyclesOne: maxLevelBonusOne > 0 ? (totalCostOne / maxLevelBonusOne) : 999999
                };
            }

            // vehicle tower (Base)
            const c = tower.cannon;
            const cannonDamage = c.damage * trait.dmg;
            const cannonCd = c.cooldown * trait.cd;
            const cannonDpsOne = cannonDamage / cannonCd;
            const ramDpsOne = last.dps * trait.dmg;
            return {
                ...base,
                ramDpsOne,
                ramDpsAll: ramDpsOne * limit,
                spawnCd: last.cd * trait.cd,
                cannonDamage,
                cannonCd,
                cannonDpsOne,
                cannonDpsAll: cannonDpsOne * limit,
                cannonRange: c.range * trait.range
            };
        }

        function renderComparison() {
            const mode = document.getElementById('compMode').value;
            const t1Group = document.getElementById('trait1Group');
            const t2Group = document.getElementById('trait2Group');
            const availTraits = getTraitsForTower(currentTowerName);
            const cols = compareColumns[baseTowers[currentTowerName].type];

            let traitList = [];
            if (mode === 'two') {
                t1Group.style.display = 'block';
                t2Group.style.display = 'block';
                traitList = [
                    document.getElementById('compTrait1').value,
                    document.getElementById('compTrait2').value
                ];
            } else {
                t1Group.style.display = 'none';
                t2Group.style.display = 'none';
                traitList = Object.keys(availTraits);
            }

            let dataList = traitList.map(tKey => getTowerTraitMetrics(currentTowerName, tKey));

            if (sortKey) {
                dataList.sort((a, b) => {
                    let valA = a[sortKey];
                    let valB = b[sortKey];
                    if (typeof valA === 'string') {
                        return sortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
                    }
                    return sortAsc ? (valA - valB) : (valB - valA);
                });
            }

            const getArrow = (key) => {
                if (sortKey !== key) return '<span class="sort-arrow">▲▼</span>';
                return sortAsc ? '<span class="sort-arrow active">▲</span>' : '<span class="sort-arrow active">▼</span>';
            };

            let html = `<table class="comp-table"><thead><tr>`;
            cols.forEach(([key, label]) => {
                html += `<th onclick="toggleSort('${key}')">${label} ${getArrow(key)}</th>`;
            });
            html += `</tr></thead><tbody>`;

            dataList.forEach(data => {
                html += '<tr>' + cols.map(([, , render]) => `<td>${render(data)}</td>`).join('') + '</tr>';
            });

            html += `</tbody></table>`;
            document.getElementById('compareResults').innerHTML = html;
        }

        buildCards();
    </script>

</body>
</html>
