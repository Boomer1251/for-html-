<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loop</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;font:16px system-ui,sans-serif;overflow:hidden}
  body{display:grid;place-items:center}
  body.playing.idle{cursor:none}
  input{display:none}

  /* picker: big in the middle at first, small "+" in the corner once playing */
  label{padding:1.5em 2.5em;border:1px dashed #888;border-radius:8px;cursor:pointer}
  body.playing label{position:fixed;top:12px;right:12px;z-index:5;padding:6px 14px;border:0;border-radius:6px;
                     background:rgba(0,0,0,.6);opacity:0;transition:opacity .25s}
  body.playing:not(.idle) label{opacity:1}

  #grid{display:none;position:fixed;inset:0;grid-auto-rows:1fr;gap:2px;background:#222}
  body.playing #grid{display:grid}
  .cell{position:relative;min-width:0;min-height:0;background:#000;overflow:hidden}
  video{width:100%;height:100%;object-fit:contain;display:block}

  .bar{position:absolute;left:0;right:0;bottom:0;height:40px;padding:0 10px;display:flex;align-items:center;gap:10px;
       opacity:0;transition:opacity .25s;background:linear-gradient(transparent,rgba(0,0,0,.6))}
  body:not(.idle) .bar{opacity:1}
  button{all:unset;cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}
  .track{position:relative;flex:1;height:4px;background:rgba(255,255,255,.3);border-radius:2px;touch-action:none;cursor:pointer}
  .bar:hover .track{height:6px}
  .fill,.range{position:absolute;top:0;bottom:0;border-radius:2px}
  .range{background:rgba(255,255,255,.35)}
  .fill{left:0;background:#f33;width:0}
  .h{position:absolute;top:50%;width:8px;height:20px;margin:-10px 0 0 -4px;background:#fff;border-radius:2px;cursor:ew-resize;touch-action:none}
</style>
<label>Choose videos<input type="file" accept="video/*" multiple></label>
<div id="grid"></div>
<script>
  const grid = document.getElementById('grid'), inp = document.querySelector('input');
  let t;

  const fs = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();

  inp.onchange = () => {
    [...inp.files].forEach(add);
    inp.value = '';
    layout();
    document.body.classList.add('playing');
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {});
  };

  function layout() {
    const n = grid.children.length;
    grid.style.gridTemplateColumns = `repeat(${n <= 3 ? n : Math.ceil(Math.sqrt(n))},1fr)`;
  }

  function add(file) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.innerHTML = '<video loop autoplay playsinline></video><div class="bar"><button class="m"></button>' +
      '<div class="track"><div class="range"></div><div class="fill"></div><i class="h a"></i><i class="h b"></i></div>' +
      '<button class="x">✕</button></div>';
    const $ = s => cell.querySelector(s);
    const v = $('video'), track = $('.track'), fill = $('.fill'), range = $('.range'),
          ha = $('.a'), hb = $('.b'), mute = $('.m');
    let a = 0, b = 1, drag = null;

    v.src = URL.createObjectURL(file);
    v.muted = grid.children.length > 0;          // only the first video has sound by default
    const icon = () => mute.textContent = v.muted ? '🔇' : '🔊';
    icon();
    mute.onclick = () => { v.muted = !v.muted; icon(); };
    $('.x').onclick = () => {
      URL.revokeObjectURL(v.src); cell.remove(); layout();
      if (!grid.children.length) { document.body.classList.remove('playing'); if (document.fullscreenElement) document.exitFullscreen(); }
    };
    v.ondblclick = fs;
    v.onclick = () => v.paused ? v.play() : v.pause();

    const frac = e => { const r = track.getBoundingClientRect(); return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); };
    track.onpointerdown = e => {
      drag = e.target === ha ? 'a' : e.target === hb ? 'b' : 'seek';
      track.setPointerCapture(e.pointerId);
      move(e);
    };
    track.onpointermove = e => { if (drag) move(e); };
    track.onpointerup = track.onpointercancel = () => { drag = null; wake(); };
    track.ondblclick = () => { a = 0; b = 1; };    // reset range
    function move(e) {
      const f = frac(e);
      if (drag === 'a') a = Math.min(f, b - 0.001);
      else if (drag === 'b') b = Math.max(f, a + 0.001);
      else v.currentTime = f * v.duration;
      cell.drag = true;
    }

    grid.append(cell);
    v.play();

    (function tick() {
      if (!cell.isConnected) return;
      cell.drag = !!drag;
      const d = v.duration;
      if (d && (a > 0 || b < 1) && (v.currentTime >= b * d || v.currentTime < a * d)) v.currentTime = a * d;
      fill.style.width = (d ? v.currentTime / d * 100 : 0) + '%';
      range.style.left = ha.style.left = a * 100 + '%';
      range.style.width = (b - a) * 100 + '%';
      hb.style.left = b * 100 + '%';
      requestAnimationFrame(tick);
    })();
  }

  // show controls on mouse activity, hide after 2s idle (not while dragging)
  const wake = () => {
    document.body.classList.remove('idle');
    clearTimeout(t);
    t = setTimeout(() => { if (![...grid.children].some(c => c.drag)) document.body.classList.add('idle'); }, 2000);
  };
  addEventListener('mousemove', wake);
  addEventListener('pointerdown', wake);

  // space = pause/play all
  addEventListener('keydown', e => {
    if (e.code !== 'Space') return;
    e.preventDefault();
    const vs = [...grid.querySelectorAll('video')], p = vs.some(v => !v.paused);
    vs.forEach(v => p ? v.pause() : v.play());
  });
</script>
