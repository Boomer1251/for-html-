<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Changelog Studio</title>
    <style>
        :root {
            --bg-dark: #0f1115;
            --panel-bg: #181b22;
            --panel-border: #2a2e39;
            --accent: #00ffcc;
            --accent-hover: #00ccaa;
            --text-main: #f0f0f5;
            --text-muted: #9ba1b0;
            --danger: #ff4d4d;
            --danger-hover: #cc3333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Editor */
        .sidebar {
            width: 520px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            height: 100%;
            z-index: 10;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-header h1 {
            font-size: 20px;
            color: var(--accent);
            letter-spacing: 0.5px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--accent);
            color: #000;
            border: none;
            padding: 8px 14px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-size: 13px;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        button.secondary {
            background-color: #2a2e39;
            color: var(--text-main);
        }

        button.secondary:hover {
            background-color: #383d4c;
        }

        button.danger {
            background-color: var(--danger);
            color: #fff;
        }

        button.danger:hover {
            background-color: var(--danger-hover);
        }

        /* Quick Tag Buttons */
        .tag-toolbar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        .tag-toolbar span {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-right: 2px;
        }

        button.tag-btn {
            padding: 4px 9px;
            font-size: 11px;
            border-radius: 4px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        button.tag-new {
            background-color: rgba(85, 255, 127, 0.15);
            color: #55ff7f;
            border: 1px solid rgba(85, 255, 127, 0.4);
        }
        button.tag-new:hover {
            background-color: rgba(85, 255, 127, 0.28);
        }

        button.tag-fix {
            background-color: rgba(255, 85, 85, 0.15);
            color: #ff5555;
            border: 1px solid rgba(255, 85, 85, 0.4);
        }
        button.tag-fix:hover {
            background-color: rgba(255, 85, 85, 0.28);
        }

        button.tag-balance {
            background-color: rgba(255, 204, 77, 0.15);
            color: #ffcc4d;
            border: 1px solid rgba(255, 204, 77, 0.4);
        }
        button.tag-balance:hover {
            background-color: rgba(255, 204, 77, 0.28);
        }

        button.tag-bullet {
            background-color: #252934;
            color: #d2d2d2;
            border: 1px solid #383e4f;
        }
        button.tag-bullet:hover {
            background-color: #323746;
        }

        .editor-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .version-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .version-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        input[type="text"], textarea {
            background: #111318;
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            width: 100%;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        textarea {
            resize: vertical;
            min-height: 95px;
            font-family: monospace;
            font-size: 13px;
            line-height: 1.4;
        }

        .patch-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-left: 10px;
            border-left: 2px solid var(--panel-border);
            margin-top: 5px;
        }

        .patch-item {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .patch-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        /* Preview Area */
        .preview-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1b202b 0%, #0b0d12 100%);
            padding: 40px;
            position: relative;
        }

        .preview-title {
            position: absolute;
            top: 20px;
            left: 25px;
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Simulated Roblox SurfaceGui (Original Style + Readable Scale) */
        .roblox-surface {
            width: 800px;
            height: 600px;
            background-color: rgba(0, 0, 0, 0.8);
            border: 5px solid #000;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
        }

        .roblox-header {
            height: 56px;
            width: 100%;
            position: relative;
            display: flex;
            align-items: center;
        }

        .roblox-title {
            position: absolute;
            left: 10px;
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            font-family: sans-serif;
        }

        .roblox-tab-nav {
            position: absolute;
            left: 225px;
            right: 10px;
            top: 8px;
            bottom: 8px;
            display: flex;
            gap: 5px;
            overflow-x: auto;
            align-items: center;
            scrollbar-width: thin;
        }

        .roblox-tab-btn {
            background-color: #868686;
            color: #fff;
            border: none;
            padding: 0 18px;
            height: 100%;
            font-size: 24px;
            font-family: sans-serif;
            cursor: pointer;
            white-space: nowrap;
            border-radius: 0;
            flex-shrink: 0;
        }

        .roblox-tab-btn.active {
            background-color: #c8c8c8;
            color: #000;
        }

        .roblox-content-scroll {
            position: absolute;
            top: 62px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding-right: 6px;
        }

        .roblox-patch-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .roblox-patch-header {
            font-size: 26px;
            font-weight: bold;
            color: #fff;
            font-family: sans-serif;
        }

        .roblox-patch-body {
            font-size: 20px;
            color: #dcdcdc;
            font-family: sans-serif;
            white-space: pre-wrap;
            line-height: 1.35;
        }

        /* Modal / Export Overlay */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            width: 720px;
            max-height: 85vh;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .modal-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .modal-footer {
            padding: 15px 20px;
            border-top: 1px solid var(--panel-border);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h1>Changelog Studio</h1>
            <div class="action-buttons">
                <button onclick="addVersion()">+ Add Version</button>
                <button class="secondary" onclick="openExportModal()">Export Lua</button>
                <button class="secondary" onclick="openImportModal()">Import Lua</button>
                <button class="danger" onclick="resetDefaults()" title="Reset to default changelog data">Reset</button>
            </div>
        </div>
        <div class="editor-content" id="editorContent">
            <!-- Dynamically populated version cards -->
        </div>
    </div>

    <div class="preview-container">
        <div class="preview-title">Live Roblox SurfaceGui Preview</div>
        <div class="roblox-surface">
            <div class="roblox-header">
                <div class="roblox-title">CHANGELOGS</div>
                <div class="roblox-tab-nav" id="previewTabNav"></div>
            </div>
            <div class="roblox-content-scroll" id="previewContentScroll"></div>
        </div>
    </div>

    <!-- Export / Import Modal -->
    <div class="modal-overlay" id="luaModal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Export Lua Script</h3>
                <button class="secondary" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body">
                <p id="modalDesc" style="color: var(--text-muted); font-size: 13px;">Copy the generated script below and paste it directly into Roblox Studio:</p>
                <textarea id="luaCodeBox" style="height: 360px; font-family: monospace;" readonly></textarea>
            </div>
            <div class="modal-footer" id="modalFooter">
                <button onclick="copyLuaCode()">Copy to Clipboard</button>
                <button class="secondary" onclick="closeModal()">Close</button>
            </div>
        </div>
    </div>

<script>
const DEFAULT_VERSION_DATA = [
	{
		Tab: "v0.1",
		Patches: [
			{ Header: "v0.1", Body: "- Hacklord Ability Release\n- Gave Hacklord a new ability\n- Updated shootlord\n- Fixed enemies not spawning" },
			{ Header: "v0.1.1", Body: "- Remade Voidbird" },
			{ Header: "v0.1.2", Body: "- Revamped Hacklord's pathing system\n- he now gains a 40% speed boost when he hits his ability." },
			{ Header: "v0.1.3", Body: "- Added 5 new tiles\n- buffed shootlord" }
		]
	},
	{
		Tab: "v0.2",
		Patches: [
			{ Header: "v0.2 BIG update 26.08.26", Body: "- Added level system\n- Hacklord now respawns and gets a slight buff to all of his stats when he respawns:\n  WalkSpeed: +10%\n  Entanglement Damage: +10%\n<b><font size=\"24\" color=\"#FFCC4D\">BALANCE CHANGES:</font></b>\n  Entanglement damage 25>10\n  Hacklord walkspeed 19>18\n- Added more qol stuff" }
		]
	},
	{
		Tab: "v0.3",
		Patches: [
			{ Header: "v0.3", Body: "- added Upgrades (VERY WIP)\n- updated block sfx\n- nerfed shootlord's second phase" },
			{ Header: "v0.3.1", Body: "- Nerfed some of the enemies\n- Fixed the upgrade bugs\n- Made the gift generation better in general\n- fixed more bugs" }
		]
	},
	{
		Tab: "v0.4",
		Patches: [
			{ Header: "v0.4", Body: "- replaced dive with dash\n- made some changes to voidbird" },
			{ Header: "v0.4.1", Body: "- Added more music" }
		]
	},
	{
		Tab: "v0.5",
		Patches: [
			{ Header: "v0.5 15.09.26", Body: "- Nerfed most of the enemies to make the gameplay better\n- Added a new upgrade \n(its been a long time )" }
		]
	},
	{
		Tab: "v0.6",
		Patches: [
			{ Header: "v0.6 21.09.26", Body: "- QOL changes\n- New speed meter" },
			{ Header: "v0.6.2   14.10.26", Body: "- Fixed some sounds being too loud\n- Hacklord's ability now cancels your dash when hit and locks it for a few seconds\n- New Dash cooldown UI " }
		]
	},
	{
		Tab: "v0.7",
		Patches: [
			{ Header: "v0.7 - THE COLLAPSE UPDATE", Body: "- Added Collapse (real)\n- Rearranged some of the UI" },
			{ Header: "v0.7.1   28.10.26", Body: "- QOL changes\n- Added team colors to the leaderboard\n- Sprinting now gains momentum instead of adding the speed instantly" }
		]
	},
	{
		Tab: "v0.8",
		Patches: [
			{ Header: "v0.8 31.10.26", Body: "- Added the chosen stuff hud \n- lots of new upgrades\n- Rearranged the uis (once again)\n- Added a gift counter for golden gifts \n- Shootlord's orbs have a trail and disappear correctly when the round ends\n- Evil sacry now deals 20% of the player's hp and triggers a jumpscare instead of killing instantly on contact (the jumpscare lasts 1.25s, will change in future) \n- Added turn tiles\n- Optimized most of the enemies (game will still lag on later levels, will fix)\n- Added a heal pad in the lobby " },
			{ Header: "v0.8.1 02.11.26", Body: "Small Halloween update\n- Bring the pumpkin 15 treats to get a limited badge \n- Expanded the lobby \n- Fixed the map being too bright " },
			{ Header: "v0.8.2 08.11.26", Body: "- Added vfx to gifts\n- Ghost's appearance got updated\n- Fixed the air control upgrade \n- Added new upgrades \n- New voidbird explosion vfx\n- Added camera sway\n- Fixed upgrades not appearing on the HUD \n- removed herobrine." },
			{ Header: "v0.8.3 11.11.26", Body: "- Added beacon and dash vfx\n- Fixed \"hacklord's\" ability not appearing sometimes\n<b><font size=\"24\" color=\"#55FF7F\">NEW:</font></b>\n- Change how long the gift collect popup lasts for\n- Some more bug fixes i dont wanna list here" }
		]
	},
	{
		Tab: "v0.9",
		Patches: [
			{ Header: "v0.9", Body: "<b><font size=\"24\" color=\"#55FF7F\">NEW:</font></b>\n- Added new LEVEL system (Max is 100)\n- Added curses (3)\n- Optimized the game\n- added 2 new upgrades (12)" },
			{ Header: "v0.9.0.1 19.11.26 (gta released yay)", Body: "- Added Minesweeper" }
		]
	}
];

let versionData = JSON.parse(JSON.stringify(DEFAULT_VERSION_DATA));
let activeTab = versionData.length > 0 ? versionData[versionData.length - 1].Tab : "";

const TAG_TEMPLATES = {
    new: '<b><font size="24" color="#55FF7F">NEW:</font></b>\n- ',
    fix: '<b><font size="24" color="#FF5555">FIX:</font></b>\n- ',
    balance: '<b><font size="24" color="#FFCC4D">BALANCE CHANGES:</font></b>\n- ',
    bullet: '- '
};

function loadFromStorage() {
    const saved = localStorage.getItem('roblox_changelog_data_v2');
    if (saved) {
        try {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) {
                versionData = parsed;
                if (!versionData.some(v => v.Tab === activeTab)) {
                    activeTab = versionData[versionData.length - 1].Tab;
                }
            }
        } catch(e) { console.error(e); }
    }
}

function saveToStorage() {
    localStorage.setItem('roblox_changelog_data_v2', JSON.stringify(versionData));
}

function resetDefaults() {
    if (confirm("Reset all versions back to the default changelog?")) {
        versionData = JSON.parse(JSON.stringify(DEFAULT_VERSION_DATA));
        activeTab = versionData[versionData.length - 1].Tab;
        render();
    }
}

function render() {
    saveToStorage();
    renderEditor();
    renderPreview();
}

function renderEditor() {
    const container = document.getElementById('editorContent');
    container.innerHTML = '';

    versionData.forEach((verGroup, vIdx) => {
        const card = document.createElement('div');
        card.className = 'version-card';

        let patchesHtml = '';
        verGroup.Patches.forEach((patch, pIdx) => {
            const taId = `ta_${vIdx}_${pIdx}`;
            patchesHtml += `
                <div class="patch-item">
                    <input type="text" value="${escapeHtml(patch.Header)}" placeholder="Patch Header (e.g. v0.9.1)" oninput="updatePatch(${vIdx}, ${pIdx}, 'Header', this.value)">
                    <div class="tag-toolbar">
                        <span>Insert:</span>
                        <button type="button" class="tag-btn tag-new" onclick="insertTag(${vIdx}, ${pIdx}, 'new')">+ NEW</button>
                        <button type="button" class="tag-btn tag-fix" onclick="insertTag(${vIdx}, ${pIdx}, 'fix')">+ FIX</button>
                        <button type="button" class="tag-btn tag-balance" onclick="insertTag(${vIdx}, ${pIdx}, 'balance')">+ BALANCE</button>
                        <button type="button" class="tag-btn tag-bullet" onclick="insertTag(${vIdx}, ${pIdx}, 'bullet')">+ Bullet</button>
                    </div>
                    <textarea id="${taId}" placeholder="Patch body bullets..." oninput="updatePatch(${vIdx}, ${pIdx}, 'Body', this.value)">${escapeHtml(patch.Body)}</textarea>
                    <div class="patch-actions">
                        <button class="danger" style="padding: 4px 10px; font-size: 11px;" onclick="deletePatch(${vIdx}, ${pIdx})">Delete Patch</button>
                    </div>
                </div>
            `;
        });

        card.innerHTML = `
            <div class="version-header-row">
                <input type="text" value="${escapeHtml(verGroup.Tab)}" placeholder="Version Tab Name (e.g. v1.0)" oninput="updateVersionTab(${vIdx}, this.value)" style="font-weight: bold; font-size: 15px;">
                <button class="danger" onclick="deleteVersion(${vIdx})">Delete Version</button>
            </div>
            <div class="patch-list">
                ${patchesHtml}
                <button class="secondary" style="margin-top: 5px;" onclick="addPatch(${vIdx})">+ Add Patch</button>
            </div>
        `;
        container.appendChild(card);
    });
}

function insertTag(vIdx, pIdx, type) {
    const ta = document.getElementById(`ta_${vIdx}_${pIdx}`);
    const snippet = TAG_TEMPLATES[type];
    if (!ta) return;

    const start = ta.selectionStart;
    const end = ta.selectionEnd;
    const val = ta.value;

    // Add a newline before the tag if inserting mid-line
    const needsLeadingNewline = start > 0 && val[start - 1] !== '\n';
    const insertion = (needsLeadingNewline ? '\n' : '') + snippet;

    const newVal = val.substring(0, start) + insertion + val.substring(end);
    ta.value = newVal;
    versionData[vIdx].Patches[pIdx].Body = newVal;

    saveToStorage();
    renderPreview();

    ta.focus();
    const newCursor = start + insertion.length;
    ta.setSelectionRange(newCursor, newCursor);
}

// Safely renders Roblox RichText <b> and <font size="..." color="..."> tags in the HTML preview
function formatRichTextPreview(rawText) {
    // Escape HTML first, then re-allow safe <b> and <font> tags used by Roblox RichText
    let html = escapeHtml(rawText);
    html = html.replace(/&lt;b&gt;([\s\S]*?)&lt;\/b&gt;/gi, '<b>$1</b>');
    html = html.replace(
        /&lt;font(?:\s+size=&quot;(\d+)&quot;)?(?:\s+color=&quot;(#[0-9a-fA-F]{6})&quot;)?(?:\s+size=&quot;(\d+)&quot;)?&gt;([\s\S]*?)&lt;\/font&gt;/gi,
        (match, s1, color, s2, inner) => {
            const size = s1 || s2;
            let style = '';
            if (size) style += `font-size:${size}px;`;
            if (color) style += `color:${color};`;
            return `<span style="${style}">${inner}</span>`;
        }
    );
    return html;
}

function renderPreview() {
    const tabNav = document.getElementById('previewTabNav');
    const contentScroll = document.getElementById('previewContentScroll');
    tabNav.innerHTML = '';
    contentScroll.innerHTML = '';

    if (!versionData.some(v => v.Tab === activeTab) && versionData.length > 0) {
        activeTab = versionData[versionData.length - 1].Tab;
    }

    versionData.forEach(verGroup => {
        const btn = document.createElement('button');
        btn.className = `roblox-tab-btn ${verGroup.Tab === activeTab ? 'active' : ''}`;
        btn.innerText = verGroup.Tab;
        btn.onclick = () => {
            activeTab = verGroup.Tab;
            renderPreview();
        };
        tabNav.appendChild(btn);

        if (verGroup.Tab === activeTab) {
            verGroup.Patches.forEach(patch => {
                const group = document.createElement('div');
                group.className = 'roblox-patch-group';
                group.innerHTML = `
                    <div class="roblox-patch-header">${escapeHtml(patch.Header)}</div>
                    <div class="roblox-patch-body">${formatRichTextPreview(patch.Body)}</div>
                `;
                contentScroll.appendChild(group);
            });
        }
    });

    // Auto-scroll preview tab bar to active tab
    const activeBtn = tabNav.querySelector('.active');
    if (activeBtn) {
        activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
    }
}

function addVersion() {
    let newName = "v0." + (versionData.length + 1);
    versionData.push({
        Tab: newName,
        Patches: [
            { Header: newName, Body: '<b><font size="24" color="#55FF7F">NEW:</font></b>\n- New update changes here' }
        ]
    });
    activeTab = newName;
    render();
    const editor = document.getElementById('editorContent');
    editor.scrollTop = editor.scrollHeight;
}

function deleteVersion(vIdx) {
    if (versionData.length <= 1) {
        alert("You must keep at least one version!");
        return;
    }
    versionData.splice(vIdx, 1);
    activeTab = versionData[versionData.length - 1].Tab;
    render();
}

function updateVersionTab(vIdx, val) {
    const oldTab = versionData[vIdx].Tab;
    versionData[vIdx].Tab = val;
    if (oldTab === activeTab || !versionData.some(v => v.Tab === activeTab)) {
        activeTab = val;
    }
    saveToStorage();
    renderPreview();
}

function addPatch(vIdx) {
    versionData[vIdx].Patches.push({ Header: versionData[vIdx].Tab + ".1", Body: "- New patch notes" });
    render();
}

function deletePatch(vIdx, pIdx) {
    if (versionData[vIdx].Patches.length <= 1) {
        alert("A version must have at least one patch!");
        return;
    }
    versionData[vIdx].Patches.splice(pIdx, 1);
    render();
}

function updatePatch(vIdx, pIdx, field, val) {
    versionData[vIdx].Patches[pIdx][field] = val;
    saveToStorage();
    renderPreview();
}

function escapeHtml(text) {
    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function generateLuaTable() {
    let lua = "local versionData = {\n";
    versionData.forEach((vGroup, i) => {
        lua += `\t{\n`;
        lua += `\t\tTab = "${vGroup.Tab.replace(/\\/g, '\\\\').replace(/"/g, '\\"')}",\n`;
        lua += `\t\tPatches = {\n`;
        vGroup.Patches.forEach((patch, j) => {
            const escapedHeader = patch.Header.replace(/\\/g, '\\\\').replace(/"/g, '\\"');
            const escapedBody = patch.Body.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n');
            lua += `\t\t\t{ Header = "${escapedHeader}", Body = "${escapedBody}" }`;
            if (j < vGroup.Patches.length - 1) lua += ",";
            lua += "\n";
        });
        lua += `\t\t}\n`;
        lua += `\t}`;
        if (i < versionData.length - 1) lua += ",";
        lua += "\n";
    });
    lua += "}";
    return lua;
}

function openExportModal() {
    document.getElementById('modalTitle').innerText = "Export Lua Script";
    document.getElementById('modalDesc').innerText = "Copy the full generated Roblox Lua script below:";
    document.getElementById('luaCodeBox').value = getFullLuaScript();
    document.getElementById('modalFooter').innerHTML = `
        <button onclick="copyLuaCode()">Copy to Clipboard</button>
        <button class="secondary" onclick="closeModal()">Close</button>
    `;
    document.getElementById('luaModal').style.display = 'flex';
}

function openImportModal() {
    document.getElementById('modalTitle').innerText = "Import Lua Script";
    document.getElementById('modalDesc').innerText = "Paste your full Roblox Lua script below to load existing versions and patches:";
    document.getElementById('luaCodeBox').value = "";
    document.getElementById('luaCodeBox').readOnly = false;
    document.getElementById('modalFooter').innerHTML = `
        <button onclick="processImport()">Import Script</button>
        <button class="secondary" onclick="closeModal()">Close</button>
    `;
    document.getElementById('luaModal').style.display = 'flex';
}

function closeModal() {
    document.getElementById('luaModal').style.display = 'none';
    document.getElementById('luaCodeBox').readOnly = true;
}

function copyLuaCode() {
    const box = document.getElementById('luaCodeBox');
    box.select();
    navigator.clipboard.writeText(box.value);
    alert("Copied to clipboard!");
}

function processImport() {
    const code = document.getElementById('luaCodeBox').value;
    try {
        const match = code.match(/local\s+versionData\s*=\s*(\{[\s\S]*?\n\})/);
        if (!match) {
            alert("Could not find 'local versionData = { ... }' in the pasted script.");
            return;
        }
        
        // Safely extract strings while converting Luau table keys to JSON
        const strings = [];
        let tokenized = match[1]
            .replace(/--.*$/gm, '')
            .replace(/"((?:\\.|[^"\\])*)"/g, (_, inner) => {
                strings.push(inner);
                return `__STR_${strings.length - 1}__`;
            })
            .replace(/([a-zA-Z0-9_]+)\s*=/g, '"$1":')
            .replace(/,\s*([\]\}])/g, '$1')
            .replace(/__STR_(\d+)__/g, (_, idx) => `"${strings[Number(idx)]}"`);

        const parsed = JSON.parse(tokenized);
        if (Array.isArray(parsed)) {
            versionData = parsed;
            if (versionData.length > 0) activeTab = versionData[versionData.length - 1].Tab;
            render();
            closeModal();
            alert("Successfully imported version data!");
        } else {
            alert("Parsed data is not a valid version array.");
        }
    } catch (e) {
        alert("Failed to parse Lua table. Make sure the format matches standard Luau tables.\nError: " + e.message);
    }
}
